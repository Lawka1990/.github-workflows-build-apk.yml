name: ChatGPT - audit all app sources

concurrency:
  group: chatgpt-app-audit-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - chatgpt/full-apps-review-2026-09-29
    paths:
      - "apps/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workflow-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate workflow YAML syntax
        shell: bash
        run: |
          set -euo pipefail
          ruby -e 'require "yaml"; Dir[".github/workflows/*.{yml,yaml}"].sort.each { |f| YAML.parse_file(f); puts "OK #{f}" }'

      - name: Verify canonical release sources
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "apps/ptasie-budki" .github/workflows/google-play-ptasie-budki.yml
          grep -Fq "apps/ptasie-obserwacje" .github/workflows/google-play-ptasie-obserwacje.yml
          grep -Fq "apps/grunwald" .github/workflows/rozpakuj-zip-i-zbuduj-v12.yml
          grep -Fq "apps/zglos-obraczke" .github/workflows/release-google-play.yml
          grep -Fq "apps/lowca-mieszkan" .github/workflows/build-lowca-mieszkan-v4.yml
          ! grep -Fq "unzip -q PTASIE_BUDKI_v093.zip" .github/workflows/google-play-ptasie-budki.yml
          ! grep -Fq "unzip -q PTASIE_OBSERWACJE_v093.zip" .github/workflows/google-play-ptasie-obserwacje.yml

  flutter-apps:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        app:
          - ptasie-budki
          - ptasie-obserwacje
          - grunwald
          - lowca-mieszkan

    steps:
      - uses: actions/checkout@v7
        with:
          ref: chatgpt/full-apps-review-2026-09-29

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.4"
          channel: stable
          cache: true

      - name: Dependencies
        working-directory: apps/${{ matrix.app }}
        run: flutter pub get

      - name: Analyze
        working-directory: apps/${{ matrix.app }}
        run: flutter analyze

      - name: Security regression checks
        if: startsWith(matrix.app, 'ptasie-')
        working-directory: apps/${{ matrix.app }}
        shell: bash
        run: |
          set -euo pipefail
          ! grep -Fq "defaultValue: 'ptasia-admin'" lib/main.dart
          grep -Fq "publishableKey: supabaseAnonKey" lib/main.dart
          grep -Fq "hiddenFromUsers: isSensitive" lib/main.dart
          grep -Fq "markSiteChanged: false" lib/main.dart
          grep -Fq "claim_app_profile" lib/main.dart
          grep -Fq "set_app_role" lib/main.dart

      - name: Test
        working-directory: apps/${{ matrix.app }}
        shell: bash
        run: |
          if [[ -d test ]] && find test -type f -name '*_test.dart' | grep -q .; then
            flutter test
          else
            echo "No tests yet"
          fi

      - name: Generate Android
        working-directory: apps/${{ matrix.app }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf android
          if [[ "${{ matrix.app }}" == "grunwald" ]]; then
            flutter create --platforms android --org pl.grunwald --project-name grunwald_navigator .
            python3 tool/patch_android.py
          elif [[ "${{ matrix.app }}" == "lowca-mieszkan" ]]; then
            flutter create --platforms android --org pl.bartoszlawicki --project-name lowca_mieszkan_android .
            python3 tool/patch_android.py
          else
            flutter create --platforms android --org pl.bartoszlawicki .
            python3 tool/patch_android_variant.py
            [[ ! -f tool/patch_android_native_file_picker.py ]] || python3 tool/patch_android_native_file_picker.py
            [[ ! -f tool/patch_android_manifest.py ]] || python3 tool/patch_android_manifest.py
            [[ ! -f tool/patch_android_manifest_auth.py ]] || python3 tool/patch_android_manifest_auth.py
            [[ ! -f tool/patch_android_compile_sdk.py ]] || python3 tool/patch_android_compile_sdk.py
          fi

      - name: Build release APK
        working-directory: apps/${{ matrix.app }}
        shell: bash
        env:
          SUPABASE_URL: https://ksskwqcbnultkwxjsgor.supabase.co
          SUPABASE_ANON_KEY: sb_publishable_h7hTCQnCsGGN_MWswivJAA_ILjb3p6M
        run: |
          set -euo pipefail
          if [[ "${{ matrix.app }}" == ptasie-* ]]; then
            flutter build apk --release               --dart-define=SUPABASE_URL="$SUPABASE_URL"               --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"               --dart-define=SUPABASE_OAUTH_REDIRECT_TO="io.supabase.flutter://login-callback/"
          else
            flutter build apk --release
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: audit-${{ matrix.app }}-apk
          path: apps/${{ matrix.app }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

  zglos-obraczke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chatgpt/full-apps-review-2026-09-29
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Build and lint
        working-directory: apps/zglos-obraczke
        run: |
          gradle :app:assembleDebug
          gradle :app:lintDebug
