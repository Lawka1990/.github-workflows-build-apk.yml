name: Buduj Ptasie Obserwacje v0.9.8

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "PTASIE_OBSERWACJE_v093.zip"
      - ".github/workflows/build-ptasie-obserwacje-v093.yml"
      - ".github/scripts/remove_ptasie_version_banner.py"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Ustaw Javę
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Ustaw Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.4"
          channel: stable
          cache: true

      - name: Rozpakuj projekt
        run: |
          rm -rf app
          mkdir app
          unzip -q "PTASIE_OBSERWACJE_v093.zip" -d app

      - name: Ustaw wersję 0.9.8
        working-directory: app
        run: |
          sed -i 's/^version: .*/version: 0.9.8+105/' pubspec.yaml

      - name: Usuń opis wersji spod mapy
        run: python3 .github/scripts/remove_ptasie_version_banner.py app/lib/main.dart

      - name: Napraw start i nawigację Ptasich Obserwacji
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/main.dart')
          s = p.read_text(encoding='utf-8')
          old_supabase = "      );\n      supabaseReady = true;"
          new_supabase = "      ).timeout(const Duration(seconds: 5));\n      supabaseReady = true;"
          if old_supabase not in s:
              raise SystemExit('Nie znaleziono inicjalizacji Supabase')
          s = s.replace(old_supabase, new_supabase, 1)
          old_nav = "      bottomNavigationBar: SafeArea(\n        top: false,\n        minimum: const EdgeInsets.only(bottom: 10),\n        child: Padding(\n          padding: const EdgeInsets.fromLTRB(8, 0, 8, 4),\n          child: NavigationBar(\n            height: 72,\n            selectedIndex: min(state.currentTab, items.length - 1),\n            onDestinationSelected: state.setTab,\n            destinations: items,\n          ),\n        ),\n      ),"
          new_nav = "      bottomNavigationBar: items.length < 2\n          ? null\n          : SafeArea(\n              top: false,\n              minimum: const EdgeInsets.only(bottom: 10),\n              child: Padding(\n                padding: const EdgeInsets.fromLTRB(8, 0, 8, 4),\n                child: NavigationBar(\n                  height: 72,\n                  selectedIndex: min(state.currentTab, items.length - 1),\n                  onDestinationSelected: state.setTab,\n                  destinations: items,\n                ),\n              ),\n            ),"
          if old_nav not in s:
              raise SystemExit('Nie znaleziono dolnego paska nawigacji')
          s = s.replace(old_nav, new_nav, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Wygeneruj projekt Android
        working-directory: app
        run: |
          rm -rf android
          flutter create --platforms android --org pl.bartoszlawicki .

      - name: Zastosuj ustawienia Ptasich Obserwacji
        working-directory: app
        run: |
          python3 tool/patch_android_variant.py
          if [ -f tool/patch_android_native_file_picker.py ]; then python3 tool/patch_android_native_file_picker.py; fi
          if [ -f tool/patch_android_manifest.py ]; then python3 tool/patch_android_manifest.py || true; fi
          if [ -f tool/patch_android_manifest_auth.py ]; then python3 tool/patch_android_manifest_auth.py || true; fi
          if [ -f tool/patch_android_compile_sdk.py ]; then python3 tool/patch_android_compile_sdk.py || true; fi

      - name: Pobierz zależności
        working-directory: app
        run: flutter pub get

      - name: Sprawdź pierwszy ekran aplikacji
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test
          cat > test/startup_test.dart <<'DART'
          import 'package:flutter_test/flutter_test.dart';
          import 'package:shared_preferences/shared_preferences.dart';
          import 'package:ptasie_obserwacje/main.dart';

          void main() {
            testWidgets('pierwszy ekran renderuje się poprawnie', (tester) async {
              SharedPreferences.setMockInitialValues({});
              await tester.pumpWidget(const PtasiaApp(supabaseReady: false));
              await tester.pump();
              expect(find.text('Ptasie Obserwacje'), findsWidgets);
              expect(find.text('Obserwacje'), findsWidgets);
              expect(tester.takeException(), isNull);
            });
          }
          DART
          flutter test test/startup_test.dart -r expanded

      - name: Zbuduj APK
        working-directory: app
        env:
          SUPABASE_URL: https://ksskwqcbnultkwxjsgor.supabase.co
          SUPABASE_ANON_KEY: sb_publishable_h7hTCQnCsGGN_MWswivJAA_ILjb3p6M
          SUPABASE_OAUTH_REDIRECT_TO: ${{ secrets.SUPABASE_OAUTH_REDIRECT_TO }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_ANON_KEY"
          flutter build apk --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            --dart-define=SUPABASE_OAUTH_REDIRECT_TO="${SUPABASE_OAUTH_REDIRECT_TO:-io.supabase.flutter://login-callback/}" \
            --dart-define=APP_VERSION_NAME="0.9.8" \
            --dart-define=APP_VERSION_CODE="105"

      - name: Przygotuj stały klucz podpisu
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_BASE64_PART_1: ${{ secrets.ANDROID_KEYSTORE_BASE64_PART_1 }}
          ANDROID_KEYSTORE_BASE64_PART_2: ${{ secrets.ANDROID_KEYSTORE_BASE64_PART_2 }}
          ANDROID_KEYSTORE_BASE64_PART_3: ${{ secrets.ANDROID_KEYSTORE_BASE64_PART_3 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${ANDROID_KEYSTORE_BASE64_PART_1:-}" ] || [ -n "${ANDROID_KEYSTORE_BASE64_PART_2:-}" ] || [ -n "${ANDROID_KEYSTORE_BASE64_PART_3:-}" ]; then
            test -n "${ANDROID_KEYSTORE_BASE64_PART_1:-}" && test -n "${ANDROID_KEYSTORE_BASE64_PART_2:-}" && test -n "${ANDROID_KEYSTORE_BASE64_PART_3:-}"
            PART_1="$(printf '%s' "$ANDROID_KEYSTORE_BASE64_PART_1" | tr -d '[:space:]')"
            PART_2="$(printf '%s' "$ANDROID_KEYSTORE_BASE64_PART_2" | tr -d '[:space:]')"
            PART_3="$(printf '%s' "$ANDROID_KEYSTORE_BASE64_PART_3" | tr -d '[:space:]')"
            RAW_KEYSTORE_BASE64="${PART_1#ANDROID_KEYSTORE_BASE64_PART_1=}${PART_2#ANDROID_KEYSTORE_BASE64_PART_2=}${PART_3#ANDROID_KEYSTORE_BASE64_PART_3=}"
          else
            RAW_KEYSTORE_BASE64="${ANDROID_KEYSTORE_BASE64#ANDROID_KEYSTORE_BASE64=}"
          fi
          test -n "$RAW_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          printf '%s' "$RAW_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > upload-keystore.jks
          printf 'SIGNING_STORE_PASSWORD=%s\n' "${ANDROID_KEYSTORE_PASSWORD#ANDROID_KEYSTORE_PASSWORD=}" >> "$GITHUB_ENV"
          printf 'SIGNING_KEY_ALIAS=%s\n' "${ANDROID_KEY_ALIAS#ANDROID_KEY_ALIAS=}" >> "$GITHUB_ENV"
          printf 'SIGNING_KEY_PASSWORD=%s\n' "${ANDROID_KEY_PASSWORD#ANDROID_KEY_PASSWORD=}" >> "$GITHUB_ENV"

      - name: Podpisz i sprawdź APK
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          mkdir -p release
          "$BUILD_TOOLS/zipalign" -p -f 4 app/build/app/outputs/flutter-apk/app-release.apk release/ptasie-obserwacje-v098-aligned.apk
          "$BUILD_TOOLS/apksigner" sign \
            --ks upload-keystore.jks \
            --ks-key-alias "$SIGNING_KEY_ALIAS" \
            --ks-pass "env:SIGNING_STORE_PASSWORD" \
            --key-pass "env:SIGNING_KEY_PASSWORD" \
            --out release/ptasie-obserwacje-v098.apk \
            release/ptasie-obserwacje-v098-aligned.apk
          rm release/ptasie-obserwacje-v098-aligned.apk
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs release/ptasie-obserwacje-v098.apk
          "$BUILD_TOOLS/aapt" dump badging release/ptasie-obserwacje-v098.apk > /tmp/ptasie-badging.txt
          grep -q "package: name='pl.bartoszlawicki.ptasie_obserwacje'" /tmp/ptasie-badging.txt
          grep -q "versionName='0.9.8'" /tmp/ptasie-badging.txt
          sha256sum release/ptasie-obserwacje-v098.apk > release/ptasie-obserwacje-v098.apk.sha256

      - name: Włącz KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Sprawdź APK na emulatorze Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: "-no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim"
          script: |
            set -euo pipefail
            python3 -m pip install --quiet pillow
            adb install -r release/ptasie-obserwacje-v098.apk
            adb logcat -c
            adb shell am force-stop pl.bartoszlawicki.ptasie_obserwacje
            adb shell monkey -p pl.bartoszlawicki.ptasie_obserwacje -c android.intent.category.LAUNCHER 1
            sleep 12
            PID="$(adb shell pidof pl.bartoszlawicki.ptasie_obserwacje | tr -d '\r')"
            test -n "$PID"
            adb logcat -d --pid="$PID" > /tmp/ptasie-logcat.txt || adb logcat -d > /tmp/ptasie-logcat.txt
            ! grep -Ei 'FATAL EXCEPTION|AndroidRuntime.*FATAL|E/flutter.*Unhandled Exception' /tmp/ptasie-logcat.txt
            adb exec-out screencap -p > /tmp/ptasie-first-screen.png
            python3 - <<'PY'
            from PIL import Image, ImageStat
            img = Image.open('/tmp/ptasie-first-screen.png').convert('RGB')
            w, h = img.size
            crop = img.crop((0, int(h * 0.06), w, int(h * 0.94)))
            pixels = list(crop.getdata())
            near_black = sum(1 for r,g,b in pixels if r < 18 and g < 18 and b < 18) / len(pixels)
            mean = sum((r+g+b)/3 for r,g,b in pixels) / len(pixels)
            std = ImageStat.Stat(crop).stddev
            small = crop.resize((max(1, crop.width//10), max(1, crop.height//10)))
            unique = len(set(small.getdata()))
            print(f'near_black={near_black:.4f} mean={mean:.2f} std={std} unique={unique}')
            assert near_black < 0.95
            assert mean > 10
            assert max(std) > 4
            assert unique > 20
            PY

      - name: Zapisz diagnostykę emulatora
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Ptasie-Obserwacje-v098-emulator-diagnostics
          path: |
            /tmp/ptasie-first-screen.png
            /tmp/ptasie-logcat.txt
            /tmp/ptasie-badging.txt
          if-no-files-found: ignore
          retention-days: 30

      - name: Zapisz APK
        uses: actions/upload-artifact@v4
        with:
          name: Ptasie-Obserwacje-v098
          path: release/*
          if-no-files-found: error
          retention-days: 90

      - name: Utwórz wydanie
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ptasie_obserwacje-v0.9.8
          name: Ptasie Obserwacje v0.9.8
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
