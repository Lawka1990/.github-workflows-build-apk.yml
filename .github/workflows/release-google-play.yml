name: Zgłoś obrączkę — Google Play v27
run-name: Zgłoś obrączkę — APK testowy i podpisany AAB v27

'on':
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/release-google-play.yml"

concurrency:
  group: zglos-obraczke-google-play-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Przygotuj kanoniczne źródła Android v27
        shell: bash
        run: |
          set -euo pipefail
          rm -rf app build.gradle settings.gradle gradle.properties signing.gradle
          cp -a apps/zglos-obraczke/app ./app
          cp apps/zglos-obraczke/build.gradle ./build.gradle
          cp apps/zglos-obraczke/settings.gradle ./settings.gradle
          cp apps/zglos-obraczke/gradle.properties ./gradle.properties
          test -f app/src/main/java/pl/bartoszlawicki/zglosobraczke/MainActivity.java
          grep -Fq "applicationId 'pl.bartoszlawicki.zglosobraczke'" app/build.gradle
      - name: Ustaw Javę
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Ustaw Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Zbuduj APK testowy
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Zapisz APK testowy
        uses: actions/upload-artifact@v7
        with:
          name: ZglosObraczke-v27-APK-testowy
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Przygotuj bezpieczny podpis wydawniczy
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_BASE64_PART_1: ${{ secrets.ANDROID_KEYSTORE_BASE64_PART_1 }}
          ANDROID_KEYSTORE_BASE64_PART_2: ${{ secrets.ANDROID_KEYSTORE_BASE64_PART_2 }}
          ANDROID_KEYSTORE_BASE64_PART_3: ${{ secrets.ANDROID_KEYSTORE_BASE64_PART_3 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          missing=()
          for variable in ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!variable:-}" ]; then
              missing+=("$variable")
            fi
          done

          if [ -n "${ANDROID_KEYSTORE_BASE64_PART_1:-}" ] || [ -n "${ANDROID_KEYSTORE_BASE64_PART_2:-}" ] || [ -n "${ANDROID_KEYSTORE_BASE64_PART_3:-}" ]; then
            for variable in ANDROID_KEYSTORE_BASE64_PART_1 ANDROID_KEYSTORE_BASE64_PART_2 ANDROID_KEYSTORE_BASE64_PART_3; do
              if [ -z "${!variable:-}" ]; then
                missing+=("$variable")
              fi
            done

            PART_1="$(printf '%s' "$ANDROID_KEYSTORE_BASE64_PART_1" | tr -d '[:space:]')"
            PART_2="$(printf '%s' "$ANDROID_KEYSTORE_BASE64_PART_2" | tr -d '[:space:]')"
            PART_3="$(printf '%s' "$ANDROID_KEYSTORE_BASE64_PART_3" | tr -d '[:space:]')"
            PART_1="${PART_1#ANDROID_KEYSTORE_BASE64_PART_1=}"
            PART_2="${PART_2#ANDROID_KEYSTORE_BASE64_PART_2=}"
            PART_3="${PART_3#ANDROID_KEYSTORE_BASE64_PART_3=}"
            RAW_KEYSTORE_BASE64="${PART_1}${PART_2}${PART_3}"
          else
            if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
              missing+=("ANDROID_KEYSTORE_BASE64")
            fi
            RAW_KEYSTORE_BASE64="$ANDROID_KEYSTORE_BASE64"
          fi

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Brakuje GitHub Secrets: ${missing[*]}"
            echo "AAB nie zostanie podpisany losowym kluczem. Dodaj stały klucz wydawniczy i uruchom workflow ponownie."
            exit 1
          fi

          NORMALIZED_KEYSTORE_BASE64="$(printf '%s' "$RAW_KEYSTORE_BASE64" | tr -d '[:space:]')"
          NORMALIZED_KEYSTORE_BASE64="${NORMALIZED_KEYSTORE_BASE64#ANDROID_KEYSTORE_BASE64=}"
          NORMALIZED_KEYSTORE_BASE64="${NORMALIZED_KEYSTORE_BASE64#\"}"
          NORMALIZED_KEYSTORE_BASE64="${NORMALIZED_KEYSTORE_BASE64%\"}"

          SIGNING_STORE_PASSWORD="${ANDROID_KEYSTORE_PASSWORD#ANDROID_KEYSTORE_PASSWORD=}"
          SIGNING_KEY_ALIAS="${ANDROID_KEY_ALIAS#ANDROID_KEY_ALIAS=}"
          SIGNING_KEY_PASSWORD="${ANDROID_KEY_PASSWORD#ANDROID_KEY_PASSWORD=}"

          if ! printf '%s' "$NORMALIZED_KEYSTORE_BASE64" | base64 --decode > upload-keystore.jks; then
            echo "::error::Sekret ANDROID_KEYSTORE_BASE64 nie jest prawidłowym Base64. Wklej pełną wartość bez nazwy sekretu."
            exit 1
          fi

          {
            printf 'SIGNING_STORE_PASSWORD=%s\n' "$SIGNING_STORE_PASSWORD"
            printf 'SIGNING_KEY_ALIAS=%s\n' "$SIGNING_KEY_ALIAS"
            printf 'SIGNING_KEY_PASSWORD=%s\n' "$SIGNING_KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          keytool -list \
            -keystore upload-keystore.jks \
            -storepass "$SIGNING_STORE_PASSWORD" \
            -alias "$SIGNING_KEY_ALIAS" >/dev/null

          cat > signing.gradle <<'EOF_SIGNING'
          android {
              signingConfigs {
                  release {
                      storeFile rootProject.file('upload-keystore.jks')
                      storePassword System.getenv('SIGNING_STORE_PASSWORD')
                      keyAlias System.getenv('SIGNING_KEY_ALIAS')
                      keyPassword System.getenv('SIGNING_KEY_PASSWORD')
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF_SIGNING

          echo "apply from: rootProject.file('signing.gradle')" >> app/build.gradle

      - name: Zbuduj podpisany APK i AAB
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle :app:assembleRelease --no-daemon --stacktrace
          gradle :app:bundleRelease --no-daemon --stacktrace

      - name: Sprawdź i przygotuj APK oraz AAB
        shell: bash
        run: |
          set -euo pipefail

          APK_FILE="$(find app/build/outputs/apk/release -name '*.apk' -print -quit)"
          AAB_FILE="$(find app/build/outputs/bundle/release -name '*.aab' -print -quit)"
          if [ -z "$APK_FILE" ] || [ -z "$AAB_FILE" ]; then
            echo "::error::Nie znaleziono wynikowego APK lub AAB."
            exit 1
          fi

          mkdir -p release
          cp "$APK_FILE" "release/ZglosObraczke-v27-${GITHUB_RUN_NUMBER}.apk"
          cp "$AAB_FILE" "release/ZglosObraczke-v27-${GITHUB_RUN_NUMBER}.aab"

          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "release/ZglosObraczke-v27-${GITHUB_RUN_NUMBER}.apk"
          jarsigner -verify "release/ZglosObraczke-v27-${GITHUB_RUN_NUMBER}.aab"

          sha256sum "release/ZglosObraczke-v27-${GITHUB_RUN_NUMBER}.apk" > "release/ZglosObraczke-v27-${GITHUB_RUN_NUMBER}.apk.sha256"
          sha256sum "release/ZglosObraczke-v27-${GITHUB_RUN_NUMBER}.aab" > "release/ZglosObraczke-v27-${GITHUB_RUN_NUMBER}.aab.sha256"

          "$BUILD_TOOLS/aapt" dump badging "release/ZglosObraczke-v27-${GITHUB_RUN_NUMBER}.apk" | tee /tmp/zglos-badging.txt
          grep -q "package: name='pl.bartoszlawicki.zglosobraczke'" /tmp/zglos-badging.txt
          grep -q "targetSdkVersion:'36'" /tmp/zglos-badging.txt

          echo "Pakiet: pl.bartoszlawicki.zglosobraczke"
          echo "versionCode: $((1000000 + GITHUB_RUN_NUMBER))"
          ls -lh release

      - name: Zapisz podpisany APK i AAB
        uses: actions/upload-artifact@v7
        with:
          name: ZglosObraczke-v27-Google-Play
          path: release/*
          if-no-files-found: error
          retention-days: 90
