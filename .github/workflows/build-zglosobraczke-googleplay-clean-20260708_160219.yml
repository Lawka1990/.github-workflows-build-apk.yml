# WERSJA: 2026-07-08 16:02:19 PL
# CZYSTY BUILD DLA GOOGLE PLAY
# Pakiet aplikacji wymagany przez Google Play:
# pl.bartoszlawicki.zglosobraczke
#
# Ten workflow nie zapisuje starej nazwy aplikacji w plikach wynikowych.
# Pliki wynikowe AAB będą miały nazwy:
# pl.bartoszlawicki.zglosobraczke.aab
# pl.bartoszlawicki.zglosobraczke_20260708_160219.aab

name: Zgłoś obrączkę Google Play clean 20260708_160219
run-name: Zgłoś obrączkę — clean AAB 20260708_160219

'on':
  workflow_dispatch:
  push:
    branches: [ main ]

concurrency:
  group: zglosobraczke-clean-aab-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  FINAL_PACKAGE: pl.bartoszlawicki.zglosobraczke
  BUILD_STAMP: "20260708_160219"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Odtwórz projekt Android ze starego workflow jeśli brakuje app
        shell: bash
        run: |
          set -euo pipefail

          if [ -f app/build.gradle ] || [ -f app/build.gradle.kts ]; then
            echo "Jest folder app - używam istniejącego projektu."
            exit 0
          fi

          python3 <<'PY'
          from pathlib import Path
          import os
          import subprocess
          import sys

          workflow_dir = Path('.github/workflows')
          candidates = list(workflow_dir.glob('*.yml')) + list(workflow_dir.glob('*.yaml'))

          source = None
          lines = None

          for path in candidates:
              if path.name.startswith('build-zglosobraczke-googleplay-clean'):
                  continue
              text = path.read_text(encoding='utf-8', errors='ignore')
              if 'Utwórz projekt Android' in text and 'cat > app/build.gradle' in text and 'EOF_MAIN_JAVA' in text:
                  source = path
                  lines = text.splitlines()
                  break

          if source is None:
              print('BŁĄD: Nie znalazłem folderu app ani starego workflow, który tworzy aplikację.')
              print('Zostaw w repo stary workflow APK albo wgraj pełny projekt Android.')
              sys.exit(1)

          print(f'Odtwarzam projekt ze starego workflow: {source}')

          start_idx = None
          for i, line in enumerate(lines):
              if 'Utwórz projekt Android' in line:
                  start_idx = i
                  break

          if start_idx is None:
              print("BŁĄD: Brak kroku 'Utwórz projekt Android'.")
              sys.exit(1)

          run_idx = None
          for i in range(start_idx, min(start_idx + 80, len(lines))):
              if lines[i].strip() == 'run: |':
                  run_idx = i
                  break

          if run_idx is None:
              print("BŁĄD: Nie znalazłem 'run: |'.")
              sys.exit(1)

          block = []
          for line in lines[run_idx + 1:]:
              if line.startswith('      - name:'):
                  break
              block.append(line)

          indents = [len(line) - len(line.lstrip(' ')) for line in block if line.strip()]
          indent = min(indents) if indents else 0
          script = '\n'.join(line[indent:] if len(line) >= indent else '' for line in block)

          script_path = Path('/tmp/restore_zglos_obraczke_project.sh')
          script_path.write_text('#!/usr/bin/env bash\nset -euo pipefail\n' + script + '\n', encoding='utf-8')
          os.chmod(script_path, 0o755)
          subprocess.run(['bash', str(script_path)], check=True)
          print('Projekt Android odtworzony.')
          PY

      - name: Wymuś pakiet Google Play w całym projekcie
        shell: bash
        run: |
          set -euo pipefail

          echo "FINAL_PACKAGE=$FINAL_PACKAGE"

          if [ ! -f app/build.gradle ]; then
            echo "BŁĄD: Brak app/build.gradle"
            exit 1
          fi

          python3 <<'PY'
          from pathlib import Path
          import os
          import re
          import shutil

          final_pkg = os.environ['FINAL_PACKAGE']
          stamp = os.environ['BUILD_STAMP']
          run_number = int(os.environ.get('GITHUB_RUN_NUMBER', '1'))

          gradle = Path('app/build.gradle')
          text = gradle.read_text(encoding='utf-8', errors='ignore')

          # Wymuszenie namespace i applicationId.
          if re.search(r"namespace\s+['\"]", text):
              text = re.sub(r"namespace\s+['\"][^'\"]+['\"]", f"namespace '{final_pkg}'", text)
          else:
              text = text.replace('android {', f"android {{\n    namespace '{final_pkg}'", 1)

          if re.search(r"applicationId\s+['\"]", text):
              text = re.sub(r"applicationId\s+['\"][^'\"]+['\"]", f"applicationId '{final_pkg}'", text)
          else:
              text = text.replace('defaultConfig {', f"defaultConfig {{\n        applicationId '{final_pkg}'", 1)

          # Google Play wymaga rosnącego versionCode.
          version_code = 100000 + run_number
          if re.search(r"versionCode\s+\d+", text):
              text = re.sub(r"versionCode\s+\d+", f"versionCode {version_code}", text)
          else:
              text = text.replace('defaultConfig {', f"defaultConfig {{\n        versionCode {version_code}", 1)

          if re.search(r"versionName\s+['\"]", text):
              text = re.sub(r"versionName\s+['\"][^'\"]+['\"]", f"versionName '0.1.{run_number}-{stamp}'", text)
          else:
              text = text.replace('defaultConfig {', f"defaultConfig {{\n        versionName '0.1.{run_number}-{stamp}'", 1)

          gradle.write_text(text, encoding='utf-8')

          # Ustal aktualne pakiety Java i zmień je na final_pkg.
          java_root = Path('app/src/main/java')
          if java_root.exists():
              for f in java_root.rglob('*.java'):
                  s = f.read_text(encoding='utf-8', errors='ignore')
                  s = re.sub(r'package\s+pl\.bartoszlawicki\.[A-Za-z0-9_.]+\s*;', f'package {final_pkg};', s)
                  s = re.sub(r'import\s+pl\.bartoszlawicki\.[A-Za-z0-9_.]+\.', f'import {final_pkg}.', s)
                  f.write_text(s, encoding='utf-8')

              final_dir = java_root / Path(final_pkg.replace('.', '/'))
              final_dir.mkdir(parents=True, exist_ok=True)

              # Przenieś wszystkie pliki Java spod pl/bartoszlawicki/* do folderu final_pkg.
              base = java_root / 'pl' / 'bartoszlawicki'
              if base.exists():
                  for f in list(base.rglob('*.java')):
                      if final_dir in f.parents:
                          continue
                      target = final_dir / f.name
                      shutil.move(str(f), str(target))

                  # Sprzątanie pustych folderów.
                  for d in sorted(base.rglob('*'), key=lambda p: len(str(p)), reverse=True):
                      if d.is_dir():
                          try:
                              d.rmdir()
                          except OSError:
                              pass

          # XML i manifest - podmień każdy pakiet pl.bartoszlawicki.* na final_pkg.
          for root in [Path('app/src/main/res'), Path('app/src/main')]:
              if not root.exists():
                  continue
              for f in root.rglob('*'):
                  if not f.is_file() or f.suffix.lower() not in ['.xml', '.txt']:
                      continue
                  s = f.read_text(encoding='utf-8', errors='ignore')
                  s = re.sub(r'pl\.bartoszlawicki\.[A-Za-z0-9_.]+', final_pkg, s)
                  f.write_text(s, encoding='utf-8')
          PY

          echo "Kontrola build.gradle:"
          grep -nE "namespace|applicationId|versionCode|versionName" app/build.gradle || true

          echo "Kontrola pakietu Java:"
          grep -R "package pl.bartoszlawicki" -n app/src/main/java || true

          echo "Kontrola czy nie został inny pakiet pl.bartoszlawicki.* niż docelowy:"
          python3 <<'PY'
          from pathlib import Path
          import os
          import re
          import sys

          final_pkg = os.environ['FINAL_PACKAGE']
          bad = []
          for root in [Path('app'), Path('build.gradle'), Path('settings.gradle'), Path('gradle.properties')]:
              if not root.exists():
                  continue
              files = root.rglob('*') if root.is_dir() else [root]
              for f in files:
                  if not f.is_file():
                      continue
                  if f.suffix.lower() not in ['.java', '.xml', '.gradle', '.properties', '.txt'] and f.name not in ['build.gradle', 'settings.gradle', 'gradle.properties']:
                      continue
                  s = f.read_text(encoding='utf-8', errors='ignore')
                  for m in re.findall(r'pl\.bartoszlawicki\.[A-Za-z0-9_.]+', s):
                      if m != final_pkg and not m.startswith(final_pkg + '.'):
                          bad.append((str(f), m))

          if bad:
              print('BŁĄD: Znaleziono inne pakiety:')
              for item in bad[:50]:
                  print(item[0], item[1])
              sys.exit(1)
          print('OK: w projekcie został tylko pakiet docelowy.')
          PY

      - name: Ustaw Javę
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Ustaw Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Przygotuj podpis release
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "Używam klucza z GitHub Secrets."
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > upload-keystore.jks

            STORE_PASS="$ANDROID_KEYSTORE_PASSWORD"
            KEY_ALIAS="$ANDROID_KEY_ALIAS"
            KEY_PASS="$ANDROID_KEY_PASSWORD"
          else
            echo "Brak sekretów podpisu. Tworzę tymczasowy klucz."
            STORE_PASS="tymczasowe_haslo_123456"
            KEY_ALIAS="upload"
            KEY_PASS="tymczasowe_haslo_123456"

            keytool -genkeypair \
              -keystore upload-keystore.jks \
              -storepass "$STORE_PASS" \
              -keypass "$KEY_PASS" \
              -alias "$KEY_ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Bartosz Lawicki, OU=Zglos Obraczke, O=Personal, L=Gdansk, ST=Pomorskie, C=PL"
          fi

          cat > signing.gradle <<'EOF_SIGNING'
          android {
              signingConfigs {
                  release {
                      storeFile rootProject.file("upload-keystore.jks")
                      storePassword System.getenv("STORE_PASS")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASS")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF_SIGNING

          grep -q "signing.gradle" app/build.gradle || echo "apply from: rootProject.file('signing.gradle')" >> app/build.gradle

          echo "STORE_PASS=$STORE_PASS" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "KEY_PASS=$KEY_PASS" >> "$GITHUB_ENV"

      - name: Zbuduj AAB release
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:bundleRelease --no-daemon --stacktrace

      - name: Przygotuj czysty plik AAB
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p aab_googleplay_clean

          AAB_FILE="$(find app/build/outputs/bundle/release -name '*.aab' | head -1)"
          if [ -z "$AAB_FILE" ]; then
            echo "BŁĄD: Nie znaleziono AAB."
            find app/build/outputs -type f | sort || true
            exit 1
          fi

          cp "$AAB_FILE" "aab_googleplay_clean/pl.bartoszlawicki.zglosobraczke.aab"
          cp "$AAB_FILE" "aab_googleplay_clean/pl.bartoszlawicki.zglosobraczke_20260708_160219.aab"

          echo "Wynikowe pliki:"
          ls -lah aab_googleplay_clean

      - name: Zapisz AAB jako artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZglosObraczke-GooglePlay-CLEAN-20260708_160219
          path: aab_googleplay_clean/*.aab
          if-no-files-found: error

      - name: Wgraj AAB do repo
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail

          BRANCH="${GITHUB_REF_NAME:-main}"

          mkdir -p /tmp/aab_googleplay_clean
          cp aab_googleplay_clean/*.aab /tmp/aab_googleplay_clean/

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin "$BRANCH"
          git reset --hard "origin/$BRANCH"

          mkdir -p aab_googleplay_clean
          cp /tmp/aab_googleplay_clean/*.aab aab_googleplay_clean/

          git add aab_googleplay_clean/*.aab
          git commit -m "Zbuduj czysty AAB Google Play 20260708_160219 [skip ci]" || echo "Brak zmian do commita"
          git push origin HEAD:"$BRANCH"
