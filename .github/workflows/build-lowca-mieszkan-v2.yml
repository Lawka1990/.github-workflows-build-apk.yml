name: Build Lowca Mieszkan v2

on:
  workflow_dispatch:
  push:
    branches:
      - lowca-mieszkan-v2
      - main
    paths:
      - ".github/workflows/build-lowca-mieszkan-v2.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Reconstruct Lowca Mieszkan source
        env:
          MAIN_DART_Z: ""
          PUBSPEC_Z: ""
          README_Z: ""
        run: |
          rm -rf lowca_mieszkan_build
          mkdir -p lowca_mieszkan_build/lib
          python3 - <<'PY'
          import os, base64, zlib
          from pathlib import Path

          root = Path("lowca_mieszkan_build")
          files = {
              root / "lib" / "main.dart": os.environ["MAIN_DART_Z"],
              root / "pubspec.yaml": os.environ["PUBSPEC_Z"],
              root / "README.md": os.environ["README_Z"],
          }
          for path, payload in files.items():
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(zlib.decompress(base64.b64decode(payload)))
              print("created", path, path.stat().st_size, "bytes")
          PY

      - name: Generate Android project
        working-directory: lowca_mieszkan_build
        run: flutter create --platforms=android --org pl.bartoszlawicki --project-name lowca_mieszkan .

      - name: Patch Android SDK and Internet permission
        working-directory: lowca_mieszkan_build
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          for path in [Path("android/app/build.gradle.kts"), Path("android/app/build.gradle")]:
              if not path.exists():
                  continue
              text = path.read_text(encoding="utf-8")
              text = text.replace("minSdk = flutter.minSdkVersion", "minSdk = 24")
              text = text.replace("minSdkVersion flutter.minSdkVersion", "minSdkVersion 24")
              text = re.sub(r"compileSdk\s*=\s*\d+", "compileSdk = 36", text)
              text = re.sub(r"targetSdk\s*=\s*\d+", "targetSdk = 36", text)
              text = re.sub(r"compileSdkVersion\s+\d+", "compileSdkVersion 36", text)
              text = re.sub(r"targetSdkVersion\s+\d+", "targetSdkVersion 36", text)
              path.write_text(text, encoding="utf-8")

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text(encoding="utf-8")
          if "android.permission.INTERNET" not in text:
              start = text.find("<manifest")
              end = text.find(">", start)
              text = text[:end + 1] + '\n    <uses-permission android:name="android.permission.INTERNET" />' + text[end + 1:]
          manifest.write_text(text, encoding="utf-8")
          PY

      - name: Get dependencies
        working-directory: lowca_mieszkan_build
        run: flutter pub get

      - name: Analyze
        working-directory: lowca_mieszkan_build
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build APK
        working-directory: lowca_mieszkan_build
        run: flutter build apk --release --no-tree-shake-icons

      - name: Build AAB
        working-directory: lowca_mieszkan_build
        run: flutter build appbundle --release --no-tree-shake-icons

      - name: Collect artifacts
        run: |
          mkdir -p lowca_mieszkan_artifacts
          cp lowca_mieszkan_build/build/app/outputs/flutter-apk/app-release.apk lowca_mieszkan_artifacts/Lowca-Mieszkan-v2.0.0.apk
          cp lowca_mieszkan_build/build/app/outputs/bundle/release/app-release.aab lowca_mieszkan_artifacts/Lowca-Mieszkan-v2.0.0.aab
          cd lowca_mieszkan_build
          zip -rq ../lowca_mieszkan_artifacts/Lowca-Mieszkan-v2.0.0-source.zip . -x ".dart_tool/*" "build/*"
          cd ..
          ls -lah lowca_mieszkan_artifacts

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lowca-mieszkan-v2
          path: lowca_mieszkan_artifacts/*
          if-no-files-found: error
