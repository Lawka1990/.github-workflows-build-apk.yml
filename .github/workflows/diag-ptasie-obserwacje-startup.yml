name: Diagnostyka startu Ptasie Obserwacje

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diag-ptasie-obserwacje-startup.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pokaż dokładny kod startowy
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/ptasie-src && mkdir -p /tmp/ptasie-src
          unzip -q PTASIE_OBSERWACJE_v093.zip -d /tmp/ptasie-src
          F=/tmp/ptasie-src/lib/main.dart
          echo '=== UPDATE 1320-1430 ==='
          sed -n '1320,1430p' "$F"
          echo '=== OBSERVATIONS 5380-5900 ==='
          sed -n '5380,5900p' "$F"
          echo '=== ANDROID VARIANT PATCH ==='
          cat /tmp/ptasie-src/tool/patch_android_variant.py
          echo '=== FILE PICKER PATCH ==='
          cat /tmp/ptasie-src/tool/patch_android_native_file_picker.py 2>/dev/null || true
