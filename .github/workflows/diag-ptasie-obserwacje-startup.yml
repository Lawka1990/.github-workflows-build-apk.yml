name: Diagnostyka startu Ptasie Obserwacje

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diag-ptasie-obserwacje-startup.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Sprawdź dokładnie HomePage
        shell: bash
        run: |
          set -euo pipefail
          unzip -p PTASIE_OBSERWACJE_v093.zip lib/main.dart > /tmp/main.dart
          echo '===== HomePage 3740-3915 ====='
          nl -ba /tmp/main.dart | sed -n '3740,3915p'
          echo '===== okolice kolejnych ekranów 3915-4070 ====='
          nl -ba /tmp/main.dart | sed -n '3915,4070p'
