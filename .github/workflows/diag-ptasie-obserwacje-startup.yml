name: Diagnostyka startu Ptasie Obserwacje

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diag-ptasie-obserwacje-startup.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Znajdź klasę ekranu obserwacji
        shell: bash
        run: |
          set -euo pipefail
          unzip -p PTASIE_OBSERWACJE_v093.zip lib/main.dart > /tmp/main.dart
          grep -n -E 'class .*Bird.*Observation|BirdObservationsPage|BirdObservation' /tmp/main.dart | head -n 120
