name: Diagnostyka startu Ptasie Obserwacje

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4
      - name: Pokaż patche Android
        shell: bash
        run: |
          set -euo pipefail
          unzip -p PTASIE_OBSERWACJE_v093.zip tool/patch_android_variant.py || true
          echo '--- manifest ---'
          unzip -p PTASIE_OBSERWACJE_v093.zip tool/patch_android_manifest.py || true
          echo '--- auth ---'
          unzip -p PTASIE_OBSERWACJE_v093.zip tool/patch_android_manifest_auth.py || true
