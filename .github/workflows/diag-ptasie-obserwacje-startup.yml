name: Diagnostyka startu Ptasie Obserwacje

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diag-ptasie-obserwacje-startup.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Sprawdź ekran i mapę obserwacji
        shell: bash
        run: |
          set -euo pipefail
          unzip -p PTASIE_OBSERWACJE_v093.zip lib/main.dart > /tmp/main.dart
          nl -ba /tmp/main.dart | sed -n '5590,5900p'
