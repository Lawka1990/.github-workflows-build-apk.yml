name: Diagnostyka startu Ptasie Obserwacje

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diag-ptasie-obserwacje-startup.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pokaż ryzykowne fragmenty startu
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/ptasie-src && mkdir -p /tmp/ptasie-src
          unzip -q PTASIE_OBSERWACJE_v093.zip -d /tmp/ptasie-src
          F=/tmp/ptasie-src/lib/main.dart
          echo '=== CHECK FOR UPDATES MATCHES ==='
          grep -nE 'checkForUpdates|appUpdateJsonUrl|appUpdateApkUrl|UpdateInfo|http\.|Uri\.parse|launchUrl' "$F" | head -n 240 || true
          echo '=== CONTEXT CHECK FOR UPDATES ==='
          L=$(grep -n 'checkForUpdates' "$F" | tail -n1 | cut -d: -f1 || true)
          if [ -n "$L" ]; then A=$((L-90)); [ $A -lt 1 ] && A=1; B=$((L+210)); sed -n "${A},${B}p" "$F"; fi
          echo '=== HOMEPAGE AND OBSERVATIONS WIDGETS ==='
          grep -nE '^class HomePage|^class .*Observation|initState\(|dispose\(|Widget build\(BuildContext context\)|NavigationBar\(' "$F" | tail -n 260 || true
          H=$(grep -n '^class HomePage' "$F" | head -n1 | cut -d: -f1 || true)
          if [ -n "$H" ]; then E=$((H+430)); sed -n "${H},${E}p" "$F"; fi
