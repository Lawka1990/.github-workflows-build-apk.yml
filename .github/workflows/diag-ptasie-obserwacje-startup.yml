name: Diagnostyka startu Ptasie Obserwacje

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diag-ptasie-obserwacje-startup.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Pokaż kod AppState i ścieżkę startową
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/ptasie-src
          mkdir -p /tmp/ptasie-src
          unzip -q PTASIE_OBSERWACJE_v093.zip -d /tmp/ptasie-src
          echo '=== KLASY I INIT ==='
          grep -nE '^class AppState|Future<.*init\(|void init\(|init\(\)|supabaseReady|Supabase\.instance|_load|load[A-Z]|restore|SharedPreferences|getInstance' /tmp/ptasie-src/lib/main.dart | head -n 400 || true
          echo '=== POCZATEK APPSTATE ==='
          START=$(grep -n '^class AppState' /tmp/ptasie-src/lib/main.dart | head -n1 | cut -d: -f1 || true)
          if [ -n "$START" ]; then
            END=$((START+950))
            sed -n "${START},${END}p" /tmp/ptasie-src/lib/main.dart
          fi
          echo '=== MAIN 70-180 ==='
          sed -n '70,180p' /tmp/ptasie-src/lib/main.dart
