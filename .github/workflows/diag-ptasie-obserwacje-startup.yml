name: Diagnostyka startu Ptasie Obserwacje

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diag-ptasie-obserwacje-startup.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Rozpakuj i pokaż ekran startowy oraz patche Android
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/ptasie-src
          mkdir -p /tmp/ptasie-src
          unzip -q PTASIE_OBSERWACJE_v093.zip -d /tmp/ptasie-src
          echo '=== HOME PAGE 3740-3930 ==='
          sed -n '3740,3930p' /tmp/ptasie-src/lib/main.dart
          for f in \
            tool/patch_android_variant.py \
            tool/patch_android_native_file_picker.py \
            tool/patch_android_manifest.py \
            tool/patch_android_manifest_auth.py \
            tool/patch_android_compile_sdk.py; do
            echo "=== $f ==="
            if [ -f "/tmp/ptasie-src/$f" ]; then cat "/tmp/ptasie-src/$f"; else echo 'BRAK'; fi
          done
          echo '=== ANDROID FILES IN ZIP ==='
          unzip -l PTASIE_OBSERWACJE_v093.zip | grep -E 'android/|tool/' | head -n 240 || true
