          cat > README.md <<'EOF_README'
          # POLRING Reporter Android — wersja ładna + RODO
          
          Aplikacja Android-only do terenowego przygotowania zgłoszenia ptaka z obrączką.
          
          ## Funkcje w tej wersji
          
          - wygląd inspirowany makietą: zielono-niebieski interfejs, karty, kroki formularza,
          - ekran danych obrączki i ptaka,
          - ekran lokalizacji, GPS, zdjęć z aparatu i galerii,
          - ekran podsumowania,
          - sekcja RODO z 3 wymaganymi checkboxami,
          - zapis szkicu lokalnie w telefonie,
          - przygotowanie wiadomości w Gmailu do `ring@miiz.waw.pl`,
          - załączanie zdjęć,
          - otwieranie oficjalnego formularza POLRING.
          
          ## Ważna informacja o RODO
          
          Teksty zgód są dodane na podstawie informacji widocznych w wynikach wyszukiwania formularza POLRING i strony rejestracji konta. Przed publikacją aplikacji należy porównać treść zgód z aktualnym oficjalnym formularzem POLRING i ewentualnie poprawić tekst w `MainActivity.java`.
          
          ## Budowa APK na GitHubie
          
          Projekt ma workflow:
          
          `.github/workflows/build-apk.yml`
          
          Po wrzuceniu repozytorium na GitHub:
          
          1. wejdź w zakładkę **Actions**,
          2. wybierz **Build POLRING Reporter APK**,
          3. kliknij **Run workflow**,
          4. po zakończeniu pobierz artifact **PolringReporter-pretty-debug-apk**.
          
          ## Instalacja na telefonie
          
          Pobrany artifact trzeba rozpakować. W środku będzie plik APK z katalogu:
          
          `app/build/outputs/apk/debug/app-debug.apk`
          
          Na Androidzie trzeba zezwolić na instalację z nieznanych źródeł.
          
          ## Następny etap
          
          Ta wersja ma otwieranie mapy systemowej, ale jeszcze nie ma pełnej wbudowanej mapy z klikaniem punktu wewnątrz aplikacji. To można dodać później przez Google Maps SDK albo OpenStreetMap/osmdroid.
