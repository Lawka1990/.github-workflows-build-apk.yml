                  SpaceSmall(buttons);
                  Button browser = blueOutlineButton("🌐 Przeglądarka");
                  browser.setOnClickListener(v -> startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse(POLRING_FORM))));
                  buttons.addView(browser, new LinearLayout.LayoutParams(0, dp(52), 1));

