name: Build POLRING Reporter Pretty APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Utwórz projekt Android
        run: |
          mkdir -p app/src/main/java/pl/bartoszlawicki/polringreporter app/src/main/res/values app/src/main/res/xml
          cat > settings.gradle <<'EOF_SETTINGS'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = 'POLRING Reporter'
          include ':app'
          EOF_SETTINGS
          cat > build.gradle <<'EOF_ROOT_BUILD'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF_ROOT_BUILD
          cat > gradle.properties <<'EOF_GRADLE_PROPERTIES'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF_GRADLE_PROPERTIES
          cat > app/build.gradle <<'EOF_APP_BUILD'
          plugins {
              id 'com.android.application'
          }
          
          android {
              namespace 'pl.bartoszlawicki.polringreporter'
              compileSdk 35
          
              defaultConfig {
                  applicationId 'pl.bartoszlawicki.polringreporter'
                  minSdk 23
                  targetSdk 35
                  versionCode 2
                  versionName '0.2.0-pretty-rodo'
              }
          
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          
          dependencies {
              implementation 'androidx.core:core:1.13.1'
          }
          EOF_APP_BUILD
          cat > app/src/main/res/values/strings.xml <<'EOF_STRINGS'
          <resources>
              <string name="app_name">POLRING Reporter</string>
          </resources>
          EOF_STRINGS
          cat > app/src/main/res/values/styles.xml <<'EOF_STYLES'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">true</item>
                  <item name="android:statusBarColor">#FAFCF7</item>
                  <item name="android:navigationBarColor">#FAFCF7</item>
                  <item name="android:colorAccent">#2E7D32</item>
              </style>
          </resources>
          EOF_STYLES
          cat > app/src/main/res/xml/file_paths.xml <<'EOF_FILE_PATHS'
          <?xml version="1.0" encoding="utf-8"?>
          <paths xmlns:android="http://schemas.android.com/apk/res/android">
              <external-files-path name="images" path="Pictures" />
              <cache-path name="cache" path="." />
          </paths>
          EOF_FILE_PATHS
          cat > app/src/main/AndroidManifest.xml <<'EOF_MANIFEST'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
          
              <uses-feature android:name="android.hardware.camera" android:required="false" />
          
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
          
              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="false">
          
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
          
                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="${applicationId}.fileprovider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/file_paths" />
                  </provider>
          
              </application>
          </manifest>
          EOF_MANIFEST
          cat > app/src/main/java/pl/bartoszlawicki/polringreporter/MainActivity.java <<'EOF_MAIN_JAVA'
          package pl.bartoszlawicki.polringreporter;
          
          import android.Manifest;
          import android.app.Activity;
          import android.content.ActivityNotFoundException;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.location.Location;
          import android.location.LocationManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.provider.MediaStore;
          import android.text.InputType;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.view.Window;
          import android.widget.Button;
          import android.widget.CheckBox;
          import android.widget.EditText;
          import android.widget.HorizontalScrollView;
          import android.widget.ImageButton;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import android.widget.Toast;
          
          import androidx.core.content.FileProvider;
          
          import org.json.JSONArray;
          import org.json.JSONObject;
          
          import java.io.File;
          import java.io.IOException;
          import java.text.SimpleDateFormat;
          import java.util.ArrayList;
          import java.util.Date;
          import java.util.Locale;
          
          public class MainActivity extends Activity {
              private static final int REQ_CAMERA = 10;
              private static final int REQ_GALLERY = 11;
              private static final int REQ_LOCATION = 12;
              private static final String PREFS = "polring_reporter_prefs_v2";
              private static final String PREF_DRAFT = "draft";
              private static final String POLRING_EMAIL = "ring@miiz.waw.pl";
              private static final String POLRING_FORM = "https://ring.stornit.gda.pl/Stw.aspx";
          
              private final int GREEN = Color.rgb(46, 125, 50);
              private final int GREEN_DARK = Color.rgb(27, 94, 32);
              private final int GREEN_LIGHT = Color.rgb(232, 245, 233);
              private final int BLUE = Color.rgb(21, 101, 192);
              private final int BLUE_LIGHT = Color.rgb(232, 240, 254);
              private final int BG = Color.rgb(250, 252, 247);
              private final int TEXT = Color.rgb(25, 32, 37);
              private final int MUTED = Color.rgb(91, 103, 112);
              private final int BORDER = Color.rgb(218, 226, 214);
          
              private int step = 0;
              private Uri currentPhotoUri;
              private final ArrayList<Uri> photoUris = new ArrayList<>();
          
              private EditText ringNumber;
              private EditText ringText;
              private EditText markerType;
              private EditText species;
              private EditText birdState;
              private EditText birdFate;
              private EditText place;
              private EditText coordinates;
              private EditText date;
              private EditText time;
              private EditText description;
              private EditText reporterName;
              private EditText reporterEmail;
              private EditText reporterPhone;
              private CheckBox rodoScientific;
              private CheckBox rodoPolring;
              private CheckBox rodoContact;
          
              private String ringNumberValue = "";
              private String ringTextValue = "";
              private String markerTypeValue = "Obrączka metalowa";
              private String speciesValue = "";
              private String birdStateValue = "Żywy – zdrowy";
              private String birdFateValue = "Zaobserwowany";
              private String placeValue = "";
              private String coordinatesValue = "";
              private String dateValue = "";
              private String timeValue = "";
              private String descriptionValue = "";
              private String reporterNameValue = "";
              private String reporterEmailValue = "";
              private String reporterPhoneValue = "";
              private boolean rodoScientificValue = false;
              private boolean rodoPolringValue = false;
              private boolean rodoContactValue = false;
          
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  Window window = getWindow();
                  window.setStatusBarColor(BG);
                  window.setNavigationBarColor(BG);
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                      window.getDecorView().setSystemUiVisibility(View.SYSTEM_UI_FLAG_LIGHT_STATUS_BAR);
                  }
                  setDefaultDateTimeValues();
                  loadDraftToModel();
                  render();
              }
          
              private void render() {
                  ScrollView scroll = new ScrollView(this);
                  scroll.setFillViewport(true);
                  scroll.setBackgroundColor(BG);
          
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(dp(14), dp(16), dp(14), dp(18));
                  scroll.addView(root, new ScrollView.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT
                  ));
          
                  addHeader(root);
                  addStepper(root);
          
                  if (step == 0) addDataScreen(root);
                  if (step == 1) addLocationScreen(root);
                  if (step == 2) addSummaryScreen(root);
          
                  setContentView(scroll);
              }
          
              private void addHeader(LinearLayout root) {
                  LinearLayout header = new LinearLayout(this);
                  header.setOrientation(LinearLayout.HORIZONTAL);
                  header.setGravity(Gravity.CENTER_VERTICAL);
                  header.setPadding(dp(6), dp(4), dp(6), dp(14));
                  root.addView(header, matchWrap());
          
                  TextView logo = new TextView(this);
                  logo.setText("🐦");
                  logo.setTextSize(30);
                  logo.setGravity(Gravity.CENTER);
                  logo.setBackground(round(GREEN_LIGHT, GREEN, dp(28), dp(1)));
                  LinearLayout.LayoutParams logoLp = new LinearLayout.LayoutParams(dp(58), dp(58));
                  header.addView(logo, logoLp);
          
                  LinearLayout titleBox = new LinearLayout(this);
                  titleBox.setOrientation(LinearLayout.VERTICAL);
                  titleBox.setPadding(dp(12), 0, 0, 0);
                  header.addView(titleBox, new LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1));
          
                  TextView title = new TextView(this);
                  title.setText("POLRING Reporter");
                  title.setTextSize(24);
                  title.setTextColor(GREEN_DARK);
                  title.setTypeface(Typeface.DEFAULT_BOLD);
                  titleBox.addView(title);
          
                  TextView subtitle = new TextView(this);
                  subtitle.setText("Zgłoszenie ptaka z obrączką");
                  subtitle.setTextSize(15);
                  subtitle.setTextColor(MUTED);
                  subtitle.setPadding(0, dp(2), 0, 0);
                  titleBox.addView(subtitle);
          
                  TextView menu = new TextView(this);
                  menu.setText("⋮");
                  menu.setTextSize(28);
                  menu.setGravity(Gravity.CENTER);
                  menu.setTextColor(TEXT);
                  header.addView(menu, new LinearLayout.LayoutParams(dp(36), dp(46)));
              }
          
              private void addStepper(LinearLayout root) {
                  LinearLayout wrap = new LinearLayout(this);
                  wrap.setOrientation(LinearLayout.VERTICAL);
                  wrap.setPadding(0, 0, 0, dp(12));
                  root.addView(wrap, matchWrap());
          
                  LinearLayout row = new LinearLayout(this);
                  row.setOrientation(LinearLayout.HORIZONTAL);
                  row.setGravity(Gravity.CENTER);
                  wrap.addView(row, matchWrap());
          
                  String[] labels = {"Dane", "Lokalizacja", "Zdjęcia", "Wysyłka"};
                  for (int i = 0; i < labels.length; i++) {
                      LinearLayout item = new LinearLayout(this);
                      item.setOrientation(LinearLayout.VERTICAL);
                      item.setGravity(Gravity.CENTER);
                      row.addView(item, new LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1));
          
                      TextView dot = new TextView(this);
                      boolean done = i < step || (step == 2 && i < 3);
                      boolean active = (step == 0 && i == 0) || (step == 1 && (i == 1 || i == 2)) || (step == 2 && i == 3);
                      dot.setText(done ? "✓" : String.valueOf(i + 1));
                      dot.setTextSize(14);
                      dot.setTypeface(Typeface.DEFAULT_BOLD);
                      dot.setTextColor(Color.WHITE);
                      dot.setGravity(Gravity.CENTER);
                      dot.setBackground(round(done ? GREEN : active ? BLUE : Color.rgb(170, 174, 166), 999));
                      item.addView(dot, new LinearLayout.LayoutParams(dp(30), dp(30)));
          
                      TextView label = new TextView(this);
                      label.setText(labels[i]);
                      label.setTextSize(12);
                      label.setTextColor(active || done ? TEXT : MUTED);
                      label.setGravity(Gravity.CENTER);
                      label.setPadding(0, dp(5), 0, 0);
                      item.addView(label);
                  }
              }
          
              private void addDataScreen(LinearLayout root) {
                  LinearLayout card = card(root, "Dane obrączki i ptaka", "Uzupełnij to, co udało się odczytać. Jedno zgłoszenie dotyczy jednego ptaka.");
                  ringNumber = addFieldRow(card, "🔗", "Numer obrączki", "Wpisz pełny numer lub kod", ringNumberValue, false, false);
                  ringText = addFieldRow(card, "ABC", "Napis na obrączce", "Dokładny tekst widoczny na obrączce", ringTextValue, false, false);
                  markerType = addFieldRow(card, "🏷", "Typ znacznika", "Np. obrączka metalowa, kolorowa, obroża", markerTypeValue, false, false);
                  species = addFieldRow(card, "🐦", "Gatunek ptaka", "Jeśli nie wiesz — wpisz „nieznany”", speciesValue, false, false);
                  birdState = addFieldRow(card, "❤", "Stan ptaka", "Np. żywy, ranny, martwy", birdStateValue, false, false);
                  birdFate = addFieldRow(card, "🍃", "Los ptaka", "Np. zaobserwowany, wypuszczony, azyl", birdFateValue, false, false);
          
                  LinearLayout nav = navRow(root);
                  Button save = outlineButton("Zapisz szkic");
                  save.setOnClickListener(v -> { updateModelFromFields(); saveDraft(); });
                  nav.addView(save, new LinearLayout.LayoutParams(0, dp(52), 1));
                  Button next = filledButton("Dalej  →");
                  next.setOnClickListener(v -> { updateModelFromFields(); step = 1; render(); });
                  nav.addView(next, new LinearLayout.LayoutParams(0, dp(52), 1));
              }
          
              private void addLocationScreen(LinearLayout root) {
                  LinearLayout locCard = card(root, "Lokalizacja", "Pobierz GPS, wpisz ręcznie albo otwórz mapę i przepisz punkt.");
          
                  TextView map = new TextView(this);
                  map.setText("🗺\n\nMapa lokalizacji\n" + (coordinatesValue.isEmpty() ? "brak współrzędnych" : coordinatesValue));
                  map.setTextSize(18);
                  map.setTextColor(BLUE);
                  map.setGravity(Gravity.CENTER);
                  map.setBackground(round(Color.rgb(235, 245, 236), Color.rgb(200, 222, 204), dp(16), dp(1)));
                  locCard.addView(map, new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, dp(170)));
          
                  LinearLayout buttons = new LinearLayout(this);
                  buttons.setOrientation(LinearLayout.HORIZONTAL);
                  buttons.setPadding(0, dp(12), 0, dp(6));
                  locCard.addView(buttons, matchWrap());
          
                  Button gps = outlineButton("◎ Pobierz GPS");
                  gps.setOnClickListener(v -> useGps());
                  buttons.addView(gps, new LinearLayout.LayoutParams(0, dp(52), 1));
          
                  SpaceSmall(buttons);
          
                  Button mapBtn = blueOutlineButton("▣ Wskaż na mapie");
                  mapBtn.setOnClickListener(v -> openMap());
                  buttons.addView(mapBtn, new LinearLayout.LayoutParams(0, dp(52), 1));
          
                  place = addFieldRow(locCard, "📍", "Miejsce", "Miejscowość, adres lub opis miejsca", placeValue, true, false);
                  coordinates = addFieldRow(locCard, "◎", "Współrzędne GPS", "Np. 54.352000, 18.646600", coordinatesValue, false, false);
                  date = addFieldRow(locCard, "📅", "Data", "Data obserwacji / znalezienia", dateValue, false, false);
                  time = addFieldRow(locCard, "🕘", "Godzina", "Przybliżona godzina", timeValue, false, false);
          
                  LinearLayout photoCard = card(root, "Zdjęcia", "Dodaj zdjęcie obrączki i/lub ptaka. POLRING zaleca zdjęcia do potwierdzenia odczytu.");
                  LinearLayout photoTiles = new LinearLayout(this);
                  photoTiles.setOrientation(LinearLayout.HORIZONTAL);
                  photoCard.addView(photoTiles, matchWrap());
                  photoTiles.addView(photoTile("Obrączka", photoUris.size() > 0 ? "✓ dodano" : "brak"), new LinearLayout.LayoutParams(0, dp(118), 1));
                  SpaceSmall(photoTiles);
                  photoTiles.addView(photoTile("Ptak", photoUris.size() > 1 ? "✓ dodano" : "opcjonalnie"), new LinearLayout.LayoutParams(0, dp(118), 1));
          
                  LinearLayout photoButtons = new LinearLayout(this);
                  photoButtons.setOrientation(LinearLayout.HORIZONTAL);
                  photoButtons.setPadding(0, dp(12), 0, dp(4));
                  photoCard.addView(photoButtons, matchWrap());
                  Button camera = outlineButton("📷 Zrób zdjęcie");
                  camera.setOnClickListener(v -> takePhoto());
                  photoButtons.addView(camera, new LinearLayout.LayoutParams(0, dp(52), 1));
                  SpaceSmall(photoButtons);
                  Button gallery = blueOutlineButton("▣ Dodaj z galerii");
                  gallery.setOnClickListener(v -> pickFromGallery());
                  photoButtons.addView(gallery, new LinearLayout.LayoutParams(0, dp(52), 1));
          
                  TextView count = helper("Zdjęcia dodane: " + photoUris.size());
                  count.setPadding(dp(4), dp(8), 0, 0);
                  photoCard.addView(count);
          
                  LinearLayout nav = navRow(root);
                  Button back = outlineButton("← Wróć");
                  back.setOnClickListener(v -> { updateModelFromFields(); step = 0; render(); });
                  nav.addView(back, new LinearLayout.LayoutParams(0, dp(52), 1));
                  Button next = filledButton("Podsumowanie  →");
                  next.setOnClickListener(v -> { updateModelFromFields(); step = 2; render(); });
                  nav.addView(next, new LinearLayout.LayoutParams(0, dp(52), 1));
              }
          
              private void addSummaryScreen(LinearLayout root) {
                  TextView pill = new TextView(this);
                  pill.setText("✓ Gotowe do sprawdzenia");
                  pill.setTextSize(15);
                  pill.setTextColor(GREEN_DARK);
                  pill.setGravity(Gravity.CENTER);
                  pill.setTypeface(Typeface.DEFAULT_BOLD);
                  pill.setBackground(round(GREEN_LIGHT, Color.rgb(175, 210, 173), dp(999), dp(1)));
                  LinearLayout.LayoutParams pillLp = new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, dp(46));
                  pillLp.setMargins(dp(28), dp(4), dp(28), dp(12));
                  root.addView(pill, pillLp);
          
                  LinearLayout summary = card(root, "Podsumowanie zgłoszenia", "Sprawdź dane przed wysłaniem.");
                  addSummaryRow(summary, "🔗", "Numer obrączki", ringNumberValue);
                  addSummaryRow(summary, "ABC", "Napis na obrączce", ringTextValue);
                  addSummaryRow(summary, "🏷", "Typ znacznika", markerTypeValue);
                  addSummaryRow(summary, "🐦", "Gatunek ptaka", speciesValue);
                  addSummaryRow(summary, "❤", "Stan ptaka", birdStateValue);
                  addSummaryRow(summary, "🍃", "Los ptaka", birdFateValue);
                  addSummaryRow(summary, "📍", "Miejsce", placeValue);
                  addSummaryRow(summary, "◎", "GPS", coordinatesValue);
                  addSummaryRow(summary, "📅", "Data", dateValue);
                  addSummaryRow(summary, "🕘", "Godzina", timeValue);
                  addSummaryRow(summary, "📷", "Zdjęcia", String.valueOf(photoUris.size()));
          
                  LinearLayout contact = card(root, "Dane zgłaszającego", "Te dane trafią do treści zgłoszenia, żeby POLRING mógł odpisać lub dopytać.");
                  reporterName = addFieldRow(contact, "👤", "Imię i nazwisko", "Dane osoby zgłaszającej", reporterNameValue, false, false);
                  reporterEmail = addFieldRow(contact, "✉", "E-mail", "Adres do odpowiedzi", reporterEmailValue, false, true);
                  reporterPhone = addFieldRow(contact, "☎", "Telefon", "Opcjonalnie", reporterPhoneValue, false, false);
                  reporterPhone.setInputType(InputType.TYPE_CLASS_PHONE);
          
                  LinearLayout rodo = card(root, "RODO i zgody", "Wymagane przed wysłaniem. Tekst dodany na podstawie informacji widocznych przy formularzu POLRING i rejestracji konta.");
                  rodoScientific = addCheckbox(rodo, "Wyrażam zgodę na przetwarzanie moich danych osobowych w celach naukowych związanych ze zgłoszeniem ptaka z obrączką.", rodoScientificValue);
                  rodoPolring = addCheckbox(rodo, "Akceptuję, że dane zostaną przekazane do systemu POLRING / Krajowej Centrali Obrączkowania i będą obsługiwane przez stronę oraz oprogramowanie POLRING.", rodoPolringValue);
                  rodoContact = addCheckbox(rodo, "Potwierdzam, że podaję dane dobrowolnie i zgadzam się na kontakt w celu weryfikacji albo uzupełnienia zgłoszenia.", rodoContactValue);
          
                  description = addFieldRow(rodo, "📝", "Opis / uwagi", "Dodatkowe informacje, np. przyczyna śmierci lub okoliczności", descriptionValue, true, false);
          
                  Button polring = filledButton("✈  Wyślij do POLRING / otwórz formularz");
                  polring.setOnClickListener(v -> openPolringForm());
                  root.addView(polring, fullButtonLp());
          
                  Button gmail = gmailButton("M  Wyślij przez Gmail");
                  gmail.setOnClickListener(v -> sendViaGmail());
                  root.addView(gmail, fullButtonLp());
          
                  Button save = outlineButton("▣  Zapisz szkic");
                  save.setOnClickListener(v -> { updateModelFromFields(); saveDraft(); });
                  root.addView(save, fullButtonLp());
          
                  LinearLayout nav = navRow(root);
                  Button back = outlineButton("← Wróć do lokalizacji");
                  back.setOnClickListener(v -> { updateModelFromFields(); step = 1; render(); });
                  nav.addView(back, new LinearLayout.LayoutParams(0, dp(52), 1));
                  Button clear = dangerOutlineButton("Wyczyść");
                  clear.setOnClickListener(v -> clearForm());
                  nav.addView(clear, new LinearLayout.LayoutParams(0, dp(52), 1));
          
                  TextView lock = helper("🔒 Twoje dane są zapisane lokalnie w telefonie. Przy wysyłce przez Gmail widzisz treść maila przed kliknięciem Wyślij.");
                  lock.setPadding(dp(6), dp(8), dp(6), dp(10));
                  root.addView(lock);
              }
          
              private LinearLayout card(LinearLayout root, String title, String subtitle) {
                  LinearLayout c = new LinearLayout(this);
                  c.setOrientation(LinearLayout.VERTICAL);
                  c.setPadding(dp(14), dp(14), dp(14), dp(14));
                  c.setBackground(round(Color.WHITE, BORDER, dp(18), dp(1)));
                  LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT);
                  lp.setMargins(0, dp(8), 0, dp(12));
                  root.addView(c, lp);
          
                  TextView t = new TextView(this);
                  t.setText(title);
                  t.setTextSize(18);
                  t.setTextColor(TEXT);
                  t.setTypeface(Typeface.DEFAULT_BOLD);
                  c.addView(t);
          
                  if (subtitle != null && !subtitle.isEmpty()) {
                      TextView s = helper(subtitle);
                      s.setPadding(0, dp(4), 0, dp(8));
                      c.addView(s);
                  }
                  return c;
              }
          
              private EditText addFieldRow(LinearLayout parent, String icon, String label, String hint, String value, boolean multiline, boolean email) {
                  LinearLayout row = new LinearLayout(this);
                  row.setOrientation(LinearLayout.HORIZONTAL);
                  row.setGravity(Gravity.TOP);
                  row.setPadding(0, dp(10), 0, dp(10));
                  parent.addView(row, matchWrap());
          
                  TextView ic = new TextView(this);
                  ic.setText(icon);
                  ic.setTextSize(icon.length() <= 2 ? 18 : 12);
                  ic.setGravity(Gravity.CENTER);
                  ic.setTextColor(GREEN_DARK);
                  ic.setTypeface(Typeface.DEFAULT_BOLD);
                  ic.setBackground(round(GREEN_LIGHT, 999));
                  LinearLayout.LayoutParams icLp = new LinearLayout.LayoutParams(dp(46), dp(46));
                  row.addView(ic, icLp);
          
                  LinearLayout box = new LinearLayout(this);
                  box.setOrientation(LinearLayout.VERTICAL);
                  box.setPadding(dp(12), 0, 0, 0);
                  row.addView(box, new LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1));
          
                  TextView lab = new TextView(this);
                  lab.setText(label);
                  lab.setTextSize(16);
                  lab.setTextColor(TEXT);
                  lab.setTypeface(Typeface.DEFAULT_BOLD);
                  box.addView(lab);
          
                  TextView help = helper(hint);
                  help.setPadding(0, dp(2), 0, dp(6));
