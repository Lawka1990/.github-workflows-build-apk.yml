              private String buildAutofillJs() {
                  String lat = "";
                  String lon = "";
                  double[] ll = parseCoords();
                  if (ll != null) { lat = String.format(Locale.US, "%.6f", ll[0]); lon = String.format(Locale.US, "%.6f", ll[1]); }
                  return "(function(){" +
                          "const data={" +
                          "ring:'" + js(ringNumberValue) + "'," +
                          "ringText:'" + js(ringTextValue) + "'," +
                          "marker:'" + js(markerTypeValue) + "'," +
                          "species:'" + js(speciesValue) + "'," +
                          "state:'" + js(birdStateValue) + "'," +
                          "fate:'" + js(birdFateValue) + "'," +
                          "place:'" + js(placeValue) + "'," +
                          "coords:'" + js(coordinatesValue) + "'," +
                          "lat:'" + js(lat) + "'," +
                          "lon:'" + js(lon) + "'," +
                          "date:'" + js(dateValue) + "'," +
                          "time:'" + js(timeValue) + "'," +
                          "desc:'" + js(descriptionValue) + "'," +
                          "name:'" + js(reporterNameValue) + "'," +
                          "email:'" + js(reporterEmailValue) + "'," +
                          "phone:'" + js(reporterPhoneValue) + "'" +
                          "};" +
                          "function n(s){return (s||'').toString().toLowerCase().normalize('NFD').replace(/[\\u0300-\\u036f]/g,'');}" +
                          "function txt(el){let t=[el.name,el.id,el.placeholder,el.title,el.getAttribute('aria-label')].join(' '); if(el.labels){for(const l of el.labels)t+=' '+l.innerText;} let p=el.closest?el.closest('tr,div,li,p,section,fieldset'):el.parentElement; if(p)t+=' '+p.innerText; return n(t);}" +
                          "const fields=[...document.querySelectorAll('input:not([type=hidden]):not([type=button]):not([type=submit]),textarea')]; const used=new Set();" +
                          "function setf(keys,val){if(!val)return false; keys=keys.map(n); for(const el of fields){if(used.has(el)||el.type==='checkbox'||el.type==='radio')continue; const t=txt(el); if(keys.some(k=>t.includes(k))){let v=val; if(el.type==='date'&&val.match(/\\d{2}\\.\\d{2}\\.\\d{4}/)){let a=val.split('.'); v=a[2]+'-'+a[1]+'-'+a[0];} el.focus(); el.value=v; el.dispatchEvent(new Event('input',{bubbles:true})); el.dispatchEvent(new Event('change',{bubbles:true})); used.add(el); return true;}} return false;}" +
                          "function sets(keys,val){if(!val)return false; keys=keys.map(n); for(const el of document.querySelectorAll('select')){const t=txt(el); if(keys.some(k=>t.includes(k))){const vv=n(val); for(const o of el.options){if(n(o.text).includes(vv)||vv.includes(n(o.text))){el.value=o.value; el.dispatchEvent(new Event('change',{bubbles:true})); return true;}}}} return false;}" +
                          "setf(['numer','kod','ring number'],data.ring);" +
                          "setf(['napis','tekst','adres'],data.ringText);" +
                          "sets(['typ','znacznik','obraczka','obrączka'],data.marker);" +
                          "setf(['gatunek','species'],data.species);" +
                          "sets(['gatunek','species'],data.species);" +
                          "sets(['stan','status'],data.state);" +
                          "sets(['los','fate'],data.fate);" +
                          "setf(['miejsce','lokalizacja','miejscowosc','miejscowość','place'],data.place);" +
                          "setf(['wspolrzedne','współrzędne','gps','koordynaty'],data.coords);" +
                          "setf(['szerokosc','szerokość','latitude','lat'],data.lat);" +
                          "setf(['dlugosc','długość','longitude','lon','lng'],data.lon);" +
                          "setf(['data','date'],data.date);" +
                          "setf(['godzina','time'],data.time);" +
                          "setf(['opis','uwagi','comment','notes'],data.desc);" +
                          "setf(['imie','imię','nazwisko','name'],data.name);" +
                          "setf(['email','e-mail','mail'],data.email);" +
                          "setf(['telefon','phone'],data.phone);" +
                          "for(const cb of document.querySelectorAll('input[type=checkbox]')){const t=txt(cb); if(t.includes('zgod')||t.includes('rodo')||t.includes('danych')||t.includes('przetwarz')){cb.checked=true; cb.dispatchEvent(new Event('change',{bubbles:true}));}}" +
                          "console.log('Zgłoś obrączkę: proba autowypelnienia zakonczona');" +
                          "})();";
              }

              private String js(String s) {
                  if (s == null) return "";
                  return s.replace("\\", "\\\\").replace("'", "\\'").replace("\n", "\\n").replace("\r", "");
              }

              private void saveDraft() {
                  updateModelFromFields();
                  try {
                      JSONObject json = new JSONObject();
                      json.put("ringNumber", ringNumberValue);
                      json.put("ringText", ringTextValue);
                      json.put("markerType", markerTypeValue);
                      json.put("species", speciesValue);
                      json.put("birdState", birdStateValue);
                      json.put("birdFate", birdFateValue);
                      json.put("place", placeValue);
                      json.put("coordinates", coordinatesValue);
                      json.put("date", dateValue);
                      json.put("time", timeValue);
                      json.put("description", descriptionValue);
                      json.put("reporterName", reporterNameValue);
                      json.put("reporterEmail", reporterEmailValue);
                      json.put("reporterPhone", reporterPhoneValue);
                      json.put("rodoScientific", rodoScientificValue);
                      json.put("rodoPolring", rodoPolringValue);
                      json.put("rodoContact", rodoContactValue);
                      JSONArray photos = new JSONArray();
                      for (Uri uri : photoUris) photos.put(uri.toString());
                      json.put("photos", photos);
                      getSharedPreferences(PREFS, MODE_PRIVATE).edit().putString(PREF_DRAFT, json.toString()).apply();
                      Toast.makeText(this, "Szkic zapisany", Toast.LENGTH_SHORT).show();
                  } catch (Exception e) {
                      Toast.makeText(this, "Błąd zapisu szkicu", Toast.LENGTH_LONG).show();
                  }
              }

              private void loadDraftToModel() {
                  try {
                      SharedPreferences prefs = getSharedPreferences(PREFS, MODE_PRIVATE);
                      String raw = prefs.getString(PREF_DRAFT, null);
                      if (raw == null) return;
                      JSONObject json = new JSONObject(raw);
                      ringNumberValue = json.optString("ringNumber", ringNumberValue);
                      ringTextValue = json.optString("ringText", ringTextValue);
                      markerTypeValue = json.optString("markerType", markerTypeValue);
                      speciesValue = json.optString("species", speciesValue);
                      birdStateValue = json.optString("birdState", birdStateValue);
                      birdFateValue = json.optString("birdFate", birdFateValue);
                      placeValue = json.optString("place", placeValue);
                      coordinatesValue = json.optString("coordinates", coordinatesValue);
                      dateValue = json.optString("date", dateValue);
                      timeValue = json.optString("time", timeValue);
                      descriptionValue = json.optString("description", descriptionValue);
                      reporterNameValue = json.optString("reporterName", reporterNameValue);
                      reporterEmailValue = json.optString("reporterEmail", reporterEmailValue);
                      reporterPhoneValue = json.optString("reporterPhone", reporterPhoneValue);
                      rodoScientificValue = json.optBoolean("rodoScientific", rodoScientificValue);
                      rodoPolringValue = json.optBoolean("rodoPolring", rodoPolringValue);
                      rodoContactValue = json.optBoolean("rodoContact", rodoContactValue);
                      JSONArray photos = json.optJSONArray("photos");
                      if (photos != null) {
                          photoUris.clear();
                          for (int i = 0; i < photos.length(); i++) photoUris.add(Uri.parse(photos.getString(i)));
                      }
                  } catch (Exception ignored) {}
              }

              private void clearForm() {
                  ringNumberValue = ""; ringTextValue = ""; markerTypeValue = "Obrączka metalowa"; speciesValue = "";
                  birdStateValue = "Żywy – zdrowy"; birdFateValue = "Zaobserwowany"; placeValue = ""; coordinatesValue = "";
                  dateValue = ""; timeValue = ""; descriptionValue = ""; reporterNameValue = ""; reporterEmailValue = ""; reporterPhoneValue = "";
                  rodoScientificValue = false; rodoPolringValue = false; rodoContactValue = false; photoUris.clear(); setDefaultDateTimeValues();
                  getSharedPreferences(PREFS, MODE_PRIVATE).edit().remove(PREF_DRAFT).apply();
                  step = 0; render();
              }
          }
          EOF_MAIN_JAVA
          cat > README.md <<'EOF_README'
          # Zgłoś obrączkę Android — v9
          
          Zmiany w v8:
          
          - poprawiono błąd kompilacji w regexie wyboru godziny,
          - poprawiono walidację e-maila przez Android Patterns.EMAIL_ADDRESS,
          - dodano walidację formatu współrzędnych GPS przed wysyłką,
          - poprawiono przekazywanie uprawnień do załączników przez ClipData,
          - dodano zabezpieczenie, gdy usługa lokalizacji jest niedostępna,
          - uporządkowano nieużywane importy,
          - pola z wieloma opcjami są listami rozwijanymi: typ znacznika, stan ptaka, los ptaka,
          - pole gatunku ma podpowiedzi popularnych gatunków ptaków,
          - ekran lokalizacji pokazuje wbudowaną mapę OpenStreetMap z markerem dla wpisanych współrzędnych,
          - pole daty otwiera kalendarz Androida, a pole godziny otwiera wybór godziny,
          - przycisk formularza POLRING otwiera formularz wewnątrz aplikacji i próbuje wypełnić pola JavaScriptem po załadowaniu strony,
          - pełne zgłoszenie jest też kopiowane do schowka jako awaryjna metoda wklejenia,
          - nadal działa Gmail, zdjęcia, GPS, zapis szkicu i RODO,
          - dodano wysyłkę formularza jako edytowalny plik Word DOCX przez Gmail,
          - v9: ikonę Androida i logo w nagłówku zastąpiono obrazem PNG z ziębą, takim jak w zatwierdzonej makiecie,
          - v9: przycisk GPS od razu wpisuje współrzędne w pole, zapisuje szkic i odświeża marker na mapie,
          - v9: poprawiono parsowanie współrzędnych również dla formatów z polskim przecinkiem dziesiętnym.
          
          Uwaga: formularz POLRING jest zewnętrzną stroną ASP.NET i może zmienić nazwy pól. Dlatego autouzupełnianie ma tryb awaryjny: kopiowanie danych do schowka. Captcha i końcowe zatwierdzenie zawsze trzeba zrobić ręcznie.
          EOF_README
