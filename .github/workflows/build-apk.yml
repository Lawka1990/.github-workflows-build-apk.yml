              private void updateModelFromFields() {
                  if (ringNumber != null) ringNumberValue = text(ringNumber);
                  if (ringText != null) ringTextValue = text(ringText);
                  if (markerType != null) markerTypeValue = text(markerType);
                  if (species != null) speciesValue = text(species);
                  if (birdState != null) birdStateValue = text(birdState);
                  if (birdFate != null) birdFateValue = text(birdFate);
                  if (place != null) placeValue = text(place);
                  if (coordinates != null) coordinatesValue = text(coordinates);
                  if (date != null) dateValue = text(date);
                  if (time != null) timeValue = text(time);
                  if (description != null) descriptionValue = text(description);
                  if (reporterName != null) reporterNameValue = text(reporterName);
                  if (reporterEmail != null) reporterEmailValue = text(reporterEmail);
                  if (reporterPhone != null) reporterPhoneValue = text(reporterPhone);
                  if (rodoScientific != null) rodoScientificValue = rodoScientific.isChecked();
                  if (rodoPolring != null) rodoPolringValue = rodoPolring.isChecked();
                  if (rodoContact != null) rodoContactValue = rodoContact.isChecked();
