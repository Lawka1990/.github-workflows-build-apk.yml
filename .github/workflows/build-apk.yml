              private void showDatePicker() {
                  updateModelFromFields();
                  Calendar cal = Calendar.getInstance();
                  try {
                      String raw = date != null ? date.getText().toString().trim() : dateValue;
                      if (raw != null && !raw.isEmpty()) {
                          SimpleDateFormat fmt = new SimpleDateFormat("dd.MM.yyyy", Locale.getDefault());
                          fmt.setLenient(false);
                          Date parsed = fmt.parse(raw);
                          if (parsed != null) cal.setTime(parsed);
                      }
                  } catch (Exception ignored) { }

                  DatePickerDialog dialog = new DatePickerDialog(
                          this,
                          (view, year, month, dayOfMonth) -> {
                              Calendar picked = Calendar.getInstance();
                              picked.set(year, month, dayOfMonth);
                              dateValue = new SimpleDateFormat("dd.MM.yyyy", Locale.getDefault()).format(picked.getTime());
                              if (date != null) date.setText(dateValue);
                          },
                          cal.get(Calendar.YEAR),
                          cal.get(Calendar.MONTH),
                          cal.get(Calendar.DAY_OF_MONTH)
                  );
                  dialog.show();
              }

              private void showTimePicker() {
                  updateModelFromFields();
                  Calendar cal = Calendar.getInstance();
                  int hour = cal.get(Calendar.HOUR_OF_DAY);
                  int minute = cal.get(Calendar.MINUTE);
                  try {
                      String raw = time != null ? time.getText().toString().trim() : timeValue;
                      if (raw != null && raw.matches("\\d{1,2}:\\d{2}")) {
                          String[] parts = raw.split(":");
                          hour = Math.max(0, Math.min(23, Integer.parseInt(parts[0])));
                          minute = Math.max(0, Math.min(59, Integer.parseInt(parts[1])));
                      }
                  } catch (Exception ignored) { }

                  TimePickerDialog dialog = new TimePickerDialog(
                          this,
                          (view, hourOfDay, selectedMinute) -> {
                              timeValue = String.format(Locale.getDefault(), "%02d:%02d", hourOfDay, selectedMinute);
                              if (time != null) time.setText(timeValue);
                          },
                          hour,
                          minute,
                          true
                  );
                  dialog.show();
              }

