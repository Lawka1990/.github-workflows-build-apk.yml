      - name: Zbuduj APK debug
        run: gradle assembleDebug
      - name: Zapisz APK jako artifact
        uses: actions/upload-artifact@v4
        with:
          name: PolringReporter-pretty-debug-apk
          path: app/build/outputs/apk/debug/*.apk
