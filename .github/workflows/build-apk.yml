name: Build POLRING Reporter Pretty APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Utwórz projekt Android
        run: |
          mkdir -p app/src/main/java/pl/bartoszlawicki/polringreporter app/src/main/res/values app/src/main/res/xml
          cat > settings.gradle <<'EOF_SETTINGS'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = 'POLRING Reporter'
          include ':app'
          EOF_SETTINGS
          cat > build.gradle <<'EOF_ROOT_BUILD'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF_ROOT_BUILD
          cat > app/build.gradle <<'EOF_APP_BUILD'
          plugins {
              id 'com.android.application'
          }
          
          android {
              namespace 'pl.bartoszlawicki.polringreporter'
              compileSdk 35
          
              defaultConfig {
                  applicationId 'pl.bartoszlawicki.polringreporter'
                  minSdk 23
                  targetSdk 35
