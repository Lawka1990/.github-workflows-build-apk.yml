                  d.append(docRow("Stan ptaka", birdStateValue));
                  d.append(docRow("Los ptaka", birdFateValue));
                  d.append(docRow("Rodzaj stwierdzenia", eventKindValue));
                  d.append(docRow("Przyczyna śmierci / zranienia", deathCauseValue));
                  d.append(docRow("Kod okoliczności / znalezienia", findingConditionValue));
                  d.append(docRow("Pomiary", measurementsText()));
                  d.append(docRow("Dane lęgu / rodziców", broodText()));
                  d.append(docRow("Miejsce", placeValue));
                  d.append(docRow("Współrzędne GPS", coordinatesValue));
                  d.append(docRow("Link do mapy", coordinatesValue.isEmpty() ? "" : "https://maps.google.com/?q=" + coordinatesValue.replace(" ", "")));
                  d.append(docRow("Data i godzina", (dateValue.isEmpty() ? "—" : dateValue) + "  " + (timeValue.isEmpty() ? "" : timeValue)));
