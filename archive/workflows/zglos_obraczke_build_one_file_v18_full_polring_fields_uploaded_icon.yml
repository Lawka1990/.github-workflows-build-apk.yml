      - name: Ustaw Javę
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Ustaw Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Zbuduj APK debug
        run: gradle assembleDebug

      - name: Zapisz APK jako artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZglosObraczke-v18-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Skopiuj APK do repozytorium
        run: |
          mkdir -p apk
          cp app/build/outputs/apk/debug/*.apk apk/ZglosObraczke-v18-debug.apk
          ls -lh apk

      - name: Wgraj APK do zakładki Code
        run: |
          set -euo pipefail
          BRANCH="${GITHUB_REF_NAME:-main}"
          mkdir -p /tmp/zglos-obraczke-apk
          cp apk/ZglosObraczke-v18-debug.apk /tmp/zglos-obraczke-apk/ZglosObraczke-v18-debug.apk

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Pobierz najnowszy stan repo przed commitem APK.
          # To naprawia błąd: rejected main -> main (fetch first).
          git fetch origin "$BRANCH"
          git reset --hard "origin/$BRANCH"

          mkdir -p apk
          cp /tmp/zglos-obraczke-apk/ZglosObraczke-v18-debug.apk apk/ZglosObraczke-v18-debug.apk
          git add apk/ZglosObraczke-v18-debug.apk
          git commit -m "Zbuduj APK v18 [skip ci]" || echo "Brak zmian do commita"
          git push origin HEAD:"$BRANCH"
