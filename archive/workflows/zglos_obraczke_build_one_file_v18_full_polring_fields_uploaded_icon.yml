name: Build Zgłoś obrączkę APK v18
run-name: Zgłoś obrączkę — budowa APK v18

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-apk.yml'

concurrency:
  group: zglos-obraczke-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Utwórz projekt Android v18
        run: |
          set -euo pipefail
          rm -rf app build.gradle settings.gradle gradle.properties README.md
          mkdir -p app/src/main/java/pl/bartoszlawicki/polringreporter app/src/main/res/values app/src/main/res/xml app/src/main/res/drawable app/src/main/res/drawable-nodpi
          cat > settings.gradle <<'EOF_SETTINGS'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = 'Zgłoś obrączkę'
          include ':app'
          EOF_SETTINGS
          cat > build.gradle <<'EOF_ROOT_BUILD'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF_ROOT_BUILD
          cat > gradle.properties <<'EOF_GRADLE_PROPERTIES'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF_GRADLE_PROPERTIES
          cat > app/build.gradle <<'EOF_APP_BUILD'
          plugins {
              id 'com.android.application'
          }
          
          android {
              namespace 'pl.bartoszlawicki.polringreporter'
              compileSdk 35
          
              defaultConfig {
                  applicationId 'pl.bartoszlawicki.polringreporter'
                  minSdk 23
                  targetSdk 35
                  versionCode 17
                  versionName '0.17.0-polring-fields-photo-slots'
              }
          
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          
          dependencies {
              implementation 'androidx.core:core:1.13.1'
          }
          EOF_APP_BUILD
          cat > app/src/main/res/values/strings.xml <<'EOF_STRINGS'
          <resources>
              <string name="app_name">Zgłoś obrączkę</string>
          </resources>
          EOF_STRINGS
          cat > app/src/main/res/values/styles.xml <<'EOF_STYLES'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">true</item>
                  <item name="android:statusBarColor">#FAFCF7</item>
                  <item name="android:navigationBarColor">#FAFCF7</item>
                  <item name="android:colorAccent">#2E7D32</item>
              </style>
          </resources>
          EOF_STYLES
          mkdir -p app/src/main/res/drawable-nodpi
          base64 -d > app/src/main/res/drawable-nodpi/app_icon.png <<'EOF_APP_ICON_PNG'
