          - pole daty otwiera kalendarz Androida, a pole godziny otwiera wybór godziny,
          - przycisk formularza POLRING otwiera formularz wewnątrz aplikacji i próbuje wypełnić pola JavaScriptem po załadowaniu strony,
          - pełne zgłoszenie jest też kopiowane do schowka jako awaryjna metoda wklejenia,
          - nadal działa Gmail, zdjęcia, GPS, zapis szkicu i RODO,
          - dodano wysyłkę formularza jako edytowalny plik Word DOCX przez Gmail,
          - v9: ikonę Androida i logo w nagłówku zastąpiono obrazem PNG z ziębą, takim jak w zatwierdzonej makiecie,
          - v9: przycisk GPS od razu wpisuje współrzędne w pole, zapisuje szkic i odświeża marker na mapie,
          - v9: poprawiono parsowanie współrzędnych również dla formatów z polskim przecinkiem dziesiętnym.
          
          - v10: poprawiono wyzwalanie GitHub Actions — workflow uruchamia się ręcznie oraz po każdym pushu, bez ograniczenia do konkretnej gałęzi.
          - v10: poprawiono nazwy plików wynikowych i opis commita APK.
          - v11: usunięto duży obraz PNG/base64 z workflow; logo aplikacji jest teraz stabilnym wektorem Android XML, żeby nie psuło YAML/builda.
          - v19: uproszczono logo do czytelnego symbolu nogi ptaka z obrączką i znacznikiem lokalizacji.
          - v19: raport Word DOCX ma osadzone zdjęcia, a aplikacja generuje również profesjonalny raport PDF z danymi i zdjęciami.
          - v19: przycisk Gmail wysyła komplet: Word DOCX, PDF oraz oryginalne zdjęcia jako załączniki.
          
          - v19: poprawiono wgrywanie APK do zakładki Code; workflow pobiera najnowszy stan repo przed pushem i nie zapętla się po dodaniu APK.
          - v19: przebudowano raport Word i PDF: dane są w tabelach/komórkach, zdjęcia są przeskalowane, a raport mieści się w układzie 2 stron A4.
          - v19: ikona aplikacji jest prostsza i pokazuje dwie nogi ptaka oraz obrączkę na jednej nodze.
          - v19: dodano podgląd miniatur dodanych zdjęć, usuwanie pojedynczych zdjęć, podmianę zdjęcia oraz czyszczenie całej listy zdjęć.
          
          Uwaga: formularz POLRING jest zewnętrzną stroną ASP.NET i może zmienić nazwy pól. Dlatego autouzupełnianie ma tryb awaryjny: kopiowanie danych do schowka. Captcha i końcowe zatwierdzenie zawsze trzeba zrobić ręcznie.
          EOF_README
          find . -maxdepth 5 -type f | sort

      - name: Ustaw Javę
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Ustaw Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Zbuduj APK debug
        run: gradle assembleDebug

      - name: Zapisz APK jako artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZglosObraczke-v19-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Skopiuj APK do repozytorium
        run: |
          mkdir -p apk
          cp app/build/outputs/apk/debug/*.apk apk/ZglosObraczke-v20-debug.apk
          ls -lh apk

      - name: Wgraj APK do zakładki Code
        run: |
          set -euo pipefail
          BRANCH="${GITHUB_REF_NAME:-main}"
          mkdir -p /tmp/zglos-obraczke-apk
          cp apk/ZglosObraczke-v20-debug.apk /tmp/zglos-obraczke-apk/ZglosObraczke-v20-debug.apk

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Pobierz najnowszy stan repo przed commitem APK.
          # To naprawia błąd: rejected main -> main (fetch first).
          git fetch origin "$BRANCH"
          git reset --hard "origin/$BRANCH"

          mkdir -p apk
          cp /tmp/zglos-obraczke-apk/ZglosObraczke-v20-debug.apk apk/ZglosObraczke-v20-debug.apk
          git add apk/ZglosObraczke-v20-debug.apk
          git commit -m "Zbuduj APK v20 [skip ci]" || echo "Brak zmian do commita"
          git push origin HEAD:"$BRANCH"
