              private String docImage(DocImage img, int index, long maxCx) {
                  long cx = maxCx;
                  long cy = img.width > 0 ? Math.max(900000L, Math.min(2600000L, cx * img.height / img.width)) : 2200000L;
                  return "<w:p><w:r><w:drawing><wp:inline distT="0" distB="0" distL="0" distR="0">" +
                          "<wp:extent cx="" + cx + "" cy="" + cy + ""/>" +
                          "<wp:docPr id="" + (100 + index) + "" name="Zdjecie" + index + ""/>" +
                          "<a:graphic><a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/picture">" +
                          "<pic:pic><pic:nvPicPr><pic:cNvPr id="" + index + "" name="" + xml(img.name) + ""/><pic:cNvPicPr/></pic:nvPicPr>" +
                          "<pic:blipFill><a:blip r:embed="" + img.relId + ""/><a:stretch><a:fillRect/></a:stretch></pic:blipFill>" +
                          "<pic:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="" + cx + "" cy="" + cy + ""/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></pic:spPr>" +
