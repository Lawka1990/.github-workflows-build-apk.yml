              <path android:fillColor="#6F8798" android:pathData="M52,21c9,1 16,7 19,14c-4,2 -9,3 -15,3c-7,0 -13,-2 -18,-5c2,-8 7,-13 14,-12z"/>
              <path android:fillColor="#D98E52" android:pathData="M36,37c7,4 16,5 27,2c2,8 -2,16 -10,20c-10,5 -22,2 -27,-6c-5,-7 -1,-13 10,-16z"/>
              <path android:fillColor="#1F2B35" android:pathData="M67,35l18,5l-17,6c1,-4 1,-7 -1,-11z"/>
              <path android:fillColor="#FFFFFF" android:pathData="M44,42c12,1 23,5 32,12c-10,8 -24,13 -39,12c-11,-1 -19,-5 -24,-11c9,-8 19,-12 31,-13z"/>
              <path android:fillColor="#2D4050" android:pathData="M26,54c16,1 33,3 52,7c-13,7 -27,12 -43,10c-14,-2 -23,-8 -27,-16c6,-1 12,-2 18,-1z"/>
              <path android:fillColor="#FFFFFF" android:pathData="M36,57l31,5l-5,5l-31,-4z"/>
              <path android:fillColor="#FFFFFF" android:pathData="M39,67l24,3l-5,4l-21,-2z"/>
              <path android:fillColor="#1F2B35" android:pathData="M20,58c-8,2 -13,7 -16,13c9,-2 17,-5 25,-12z"/>
              <path android:fillColor="#1F2B35" android:pathData="M51,77h4v17h-4z"/>
              <path android:fillColor="#2E7D32" android:pathData="M48,81h10c2,0 3,1 3,3v8c0,2 -1,3 -3,3H48c-2,0 -3,-1 -3,-3v-8c0,-2 1,-3 3,-3z"/>
              <path android:fillColor="#EAF7E6" android:pathData="M49,85h9v6h-9z"/>
              <path android:fillColor="#2E7D32" android:pathData="M70,83c10,-1 18,-7 22,-16c-10,2 -18,8 -22,16z"/>
              <path android:fillColor="#4CAF50" android:pathData="M78,90c7,-1 13,-5 17,-11c-8,1 -14,5 -17,11z"/>
