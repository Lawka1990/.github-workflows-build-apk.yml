              private void useGps() {
                  updateModelFromFields();
                  if (Build.VERSION.SDK_INT >= 23 && checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION) != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(new String[]{Manifest.permission.ACCESS_FINE_LOCATION, Manifest.permission.ACCESS_COARSE_LOCATION}, REQ_LOCATION);
                      return;
                  }
                  fillLastKnownLocation();
              }

              private void fillLastKnownLocation() {
                  try {
                      LocationManager lm = (LocationManager) getSystemService(Context.LOCATION_SERVICE);
                      if (lm == null) {
                          Toast.makeText(this, "Usługa lokalizacji jest niedostępna", Toast.LENGTH_LONG).show();
                          return;
                      }
                      Location best = null;
                      List<String> providers = lm.getProviders(true);
                      for (String provider : providers) {
                          Location loc = lm.getLastKnownLocation(provider);
                          if (loc != null && (best == null || loc.getAccuracy() < best.getAccuracy())) best = loc;
                      }
                      if (best != null) {
                          applyLocation(best, "Pobrano ostatnią pozycję GPS");
                          return;
                      }
                      requestFreshLocation(lm);
                  } catch (SecurityException e) {
                      Toast.makeText(this, "Brak uprawnienia lokalizacji", Toast.LENGTH_LONG).show();
                  }
              }

              private void requestFreshLocation(LocationManager lm) {
                  try {
                      String provider = null;
                      if (lm.isProviderEnabled(LocationManager.GPS_PROVIDER)) provider = LocationManager.GPS_PROVIDER;
                      else if (lm.isProviderEnabled(LocationManager.NETWORK_PROVIDER)) provider = LocationManager.NETWORK_PROVIDER;
                      if (provider == null) {
                          Toast.makeText(this, "Włącz lokalizację/GPS w telefonie i spróbuj ponownie", Toast.LENGTH_LONG).show();
                          return;
                      }
                      Handler handler = new Handler(Looper.getMainLooper());
                      final Runnable[] timeout = new Runnable[1];
                      LocationListener listener = new LocationListener() {
                          @Override
                          public void onLocationChanged(Location location) {
                              try { lm.removeUpdates(this); } catch (Exception ignored) {}
                              if (timeout[0] != null) handler.removeCallbacks(timeout[0]);
                              applyLocation(location, "Pobrano aktualną pozycję GPS");
                          }
                      };
                      timeout[0] = () -> {
                          try { lm.removeUpdates(listener); } catch (Exception ignored) {}
                          Toast.makeText(this, "Nie udało się uzyskać aktualnej pozycji. Spróbuj na zewnątrz lub wpisz współrzędne ręcznie.", Toast.LENGTH_LONG).show();
                      };
                      Toast.makeText(this, "Pobieram aktualną lokalizację…", Toast.LENGTH_SHORT).show();
                      lm.requestLocationUpdates(provider, 0, 0, listener, Looper.getMainLooper());
                      handler.postDelayed(timeout[0], 15000);
                  } catch (SecurityException e) {
                      Toast.makeText(this, "Brak uprawnienia lokalizacji", Toast.LENGTH_LONG).show();
                  } catch (Exception e) {
                      Toast.makeText(this, "Nie udało się uruchomić GPS: " + e.getMessage(), Toast.LENGTH_LONG).show();
                  }
              }

              private void applyLocation(Location loc, String message) {
                  if (loc == null) return;
                  coordinatesValue = String.format(Locale.US, "%.6f, %.6f", loc.getLatitude(), loc.getLongitude());
                  if (coordinates != null) coordinates.setText(coordinatesValue);
                  updateMapFromModel();
                  saveDraft();
                  Toast.makeText(this, message + ": " + coordinatesValue, Toast.LENGTH_LONG).show();
              }

              private void refreshMapFromFields() {
                  updateModelFromFields();
                  if (!coordinatesValue.isEmpty() && parseCoords() == null) {
                      Toast.makeText(this, "Niepoprawny format GPS. Wpisz np. 54.352000, 18.646600", Toast.LENGTH_LONG).show();
                      return;
                  }
                  updateMapFromModel();
                  saveDraft();
                  Toast.makeText(this, coordinatesValue.isEmpty() ? "Mapa pokazuje Polskę — brak GPS" : "Mapa odświeżona", Toast.LENGTH_SHORT).show();
              }

              private void updateMapFromModel() {
                  updateCoordLabel();
                  if (mapWebView != null) mapWebView.loadUrl(osmEmbedUrl());
              }

              private void updateCoordLabel() {
                  if (coordLabelView == null) return;
                  coordLabelView.setText(coordinatesValue.isEmpty() ? "Aktualny punkt: brak współrzędnych" : "Aktualny punkt: " + coordinatesValue);
                  coordLabelView.setTextColor(coordinatesValue.isEmpty() ? MUTED : GREEN_DARK);
              }

              private double[] parseCoords() {
                  if (coordinatesValue == null) return null;
                  try {
                      ArrayList<Double> nums = new ArrayList<>();
                      Matcher matcher = Pattern.compile("[-+]?\\d+(?:[\\.,]\\d+)?").matcher(coordinatesValue.trim());
                      while (matcher.find()) nums.add(Double.parseDouble(matcher.group().replace(",", ".")));
                      if (nums.size() < 2) return null;
                      double lat = nums.get(0);
                      double lon = nums.get(1);
                      if (lat < -90 || lat > 90 || lon < -180 || lon > 180) return null;
                      return new double[]{lat, lon};
                  } catch (Exception e) {
                      return null;
                  }
              }

              private String osmEmbedUrl() {
                  double[] ll = parseCoords();
                  if (ll == null) {
                      return "https://www.openstreetmap.org/export/embed.html?bbox=14.0%2C49.0%2C24.5%2C55.2&layer=mapnik";
                  }
                  double lat = ll[0];
                  double lon = ll[1];
                  double d = 0.01;
                  return String.format(Locale.US,
                          "https://www.openstreetmap.org/export/embed.html?bbox=%.6f%%2C%.6f%%2C%.6f%%2C%.6f&layer=mapnik&marker=%.6f%%2C%.6f",
                          lon - d, lat - d, lon + d, lat + d, lat, lon);
              }

              private void openMap() {
                  updateModelFromFields();
                  double[] ll = parseCoords();
                  Uri uri;
                  if (ll != null) {
                      uri = Uri.parse(String.format(Locale.US, "geo:%.6f,%.6f?q=%.6f,%.6f(POLRING)", ll[0], ll[1], ll[0], ll[1]));
                  } else if (!placeValue.isEmpty()) {
                      uri = Uri.parse("geo:0,0?q=" + Uri.encode(placeValue));
                  } else {
                      Toast.makeText(this, "Najpierw wpisz miejsce lub GPS", Toast.LENGTH_LONG).show();
                      return;
                  }
                  try { startActivity(new Intent(Intent.ACTION_VIEW, uri)); }
                  catch (ActivityNotFoundException e) { Toast.makeText(this, "Brak aplikacji map", Toast.LENGTH_LONG).show(); }
              }

              private void openPolringForm() {
                  updateModelFromFields();
                  if (!validateBeforeSend(false)) return;
                  saveDraft();
                  copyReportToClipboard();
                  step = 3;
                  render();
              }

              private void takePhoto() {
                  updateModelFromFields();
                  if (Build.VERSION.SDK_INT >= 23 && checkSelfPermission(Manifest.permission.CAMERA) != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(new String[]{Manifest.permission.CAMERA}, REQ_CAMERA);
                      return;
                  }
                  Intent intent = new Intent(MediaStore.ACTION_IMAGE_CAPTURE);
                  if (intent.resolveActivity(getPackageManager()) == null) {
                      Toast.makeText(this, "Brak aplikacji aparatu", Toast.LENGTH_LONG).show();
                      return;
                  }
                  try {
                      File photoFile = createImageFile();
                      currentPhotoUri = FileProvider.getUriForFile(this, getPackageName() + ".fileprovider", photoFile);
                      intent.putExtra(MediaStore.EXTRA_OUTPUT, currentPhotoUri);
                      intent.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_GRANT_WRITE_URI_PERMISSION);
                      startActivityForResult(intent, REQ_CAMERA);
                  } catch (IOException e) {
                      Toast.makeText(this, "Nie udało się utworzyć pliku zdjęcia", Toast.LENGTH_LONG).show();
                  }
              }

              private File createImageFile() throws IOException {
                  String stamp = new SimpleDateFormat("yyyyMMdd_HHmmss", Locale.US).format(new Date());
                  File storageDir = getExternalFilesDir(Environment.DIRECTORY_PICTURES);
                  return File.createTempFile("POLRING_" + stamp + "_", ".jpg", storageDir);
              }

              private void pickFromGallery() {
                  updateModelFromFields();
                  Intent intent = new Intent(Intent.ACTION_OPEN_DOCUMENT);
                  intent.addCategory(Intent.CATEGORY_OPENABLE);
                  intent.setType("image/*");
                  intent.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_GRANT_PERSISTABLE_URI_PERMISSION);
                  startActivityForResult(intent, REQ_GALLERY);
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (resultCode != RESULT_OK) return;
                  if (requestCode == REQ_CAMERA && currentPhotoUri != null) {
                      photoUris.add(currentPhotoUri);
                      currentPhotoUri = null;
                      Toast.makeText(this, "Dodano zdjęcie", Toast.LENGTH_SHORT).show();
                      saveDraft();
                      render();
                  } else if (requestCode == REQ_GALLERY && data != null && data.getData() != null) {
                      Uri uri = data.getData();
                      try { getContentResolver().takePersistableUriPermission(uri, Intent.FLAG_GRANT_READ_URI_PERMISSION); } catch (Exception ignored) {}
                      photoUris.add(uri);
                      Toast.makeText(this, "Dodano zdjęcie z galerii", Toast.LENGTH_SHORT).show();
                      saveDraft();
                      render();
                  }
              }

              @Override
              public void onRequestPermissionsResult(int requestCode, String[] permissions, int[] grantResults) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults);
                  if (grantResults.length == 0 || grantResults[0] != PackageManager.PERMISSION_GRANTED) {
                      Toast.makeText(this, "Nie przyznano wymaganego uprawnienia", Toast.LENGTH_LONG).show();
                      return;
                  }
                  if (requestCode == REQ_LOCATION) fillLastKnownLocation();
                  if (requestCode == REQ_CAMERA) takePhoto();
              }

              private boolean validateBeforeSend(boolean emailMode) {
                  updateModelFromFields();
                  if ((ringNumberValue.isEmpty() && ringTextValue.isEmpty()) || (placeValue.isEmpty() && coordinatesValue.isEmpty())) {
                      Toast.makeText(this, "Uzupełnij obrączkę oraz miejsce lub GPS", Toast.LENGTH_LONG).show();
                      return false;
                  }
                  if (!coordinatesValue.isEmpty() && parseCoords() == null) {
                      Toast.makeText(this, "Współrzędne GPS mają niepoprawny format. Użyj np. 54.352000, 18.646600", Toast.LENGTH_LONG).show();
                      return false;
                  }
                  if (reporterEmailValue.isEmpty() || !Patterns.EMAIL_ADDRESS.matcher(reporterEmailValue).matches()) {
                      Toast.makeText(this, "Uzupełnij poprawny e-mail zgłaszającego", Toast.LENGTH_LONG).show();
                      return false;
                  }
                  if (!rodoScientificValue || !rodoPolringValue || !rodoContactValue) {
                      Toast.makeText(this, "Zaznacz wymagane zgody RODO", Toast.LENGTH_LONG).show();
                      return false;
                  }
                  return true;
              }

              private void sendViaGmail() {
                  updateModelFromFields();
                  if (!validateBeforeSend(true)) return;
                  saveDraft();
                  String subject = "Zgłoszenie ptaka z obrączką";
                  if (!ringNumberValue.isEmpty()) subject += " — " + ringNumberValue;

                  Intent intent = new Intent(Intent.ACTION_SEND_MULTIPLE);
                  intent.setType(photoUris.isEmpty() ? "message/rfc822" : "*/*");
                  intent.putExtra(Intent.EXTRA_EMAIL, new String[]{POLRING_EMAIL});
                  intent.putExtra(Intent.EXTRA_SUBJECT, subject);
                  intent.putExtra(Intent.EXTRA_TEXT, buildEmailBody());
                  if (!photoUris.isEmpty()) {
                      intent.putParcelableArrayListExtra(Intent.EXTRA_STREAM, photoUris);
                      grantAttachmentUris(intent, photoUris);
                  }

                  Intent gmailOnly = new Intent(intent);
                  gmailOnly.setPackage("com.google.android.gm");
                  try { startActivity(gmailOnly); }
                  catch (ActivityNotFoundException e) {
                      try { startActivity(Intent.createChooser(intent, "Wyślij zgłoszenie e-mailem")); }
                      catch (ActivityNotFoundException ex) { Toast.makeText(this, "Brak aplikacji e-mail", Toast.LENGTH_LONG).show(); }
                  }
              }

              private void sendViaGmailWithWord() {
                  updateModelFromFields();
                  if (!validateBeforeSend(true)) return;
                  saveDraft();
                  Uri docUri;
                  try {
                      docUri = createWordDocx();
                  } catch (Exception e) {
                      Toast.makeText(this, "Nie udało się utworzyć pliku Word", Toast.LENGTH_LONG).show();
                      return;
                  }

                  String subject = "Zgłoszenie ptaka z obrączką — formularz Word";
                  if (!ringNumberValue.isEmpty()) subject += " — " + ringNumberValue;

                  ArrayList<Uri> attachments = new ArrayList<>();
                  attachments.add(docUri);
                  attachments.addAll(photoUris);

                  Intent intent = new Intent(Intent.ACTION_SEND_MULTIPLE);
                  intent.setType("*/*");
                  intent.putExtra(Intent.EXTRA_EMAIL, new String[]{POLRING_EMAIL});
                  intent.putExtra(Intent.EXTRA_SUBJECT, subject);
                  intent.putExtra(Intent.EXTRA_TEXT,
                          "W załączniku przesyłam edytowalny formularz zgłoszenia w formacie Word DOCX.\n\n" +
                          "Dane są również poniżej w treści wiadomości.\n\n" + buildEmailBody());
                  intent.putParcelableArrayListExtra(Intent.EXTRA_STREAM, attachments);
                  grantAttachmentUris(intent, attachments);

                  Intent gmailOnly = new Intent(intent);
                  gmailOnly.setPackage("com.google.android.gm");
                  try { startActivity(gmailOnly); }
                  catch (ActivityNotFoundException e) {
                      try { startActivity(Intent.createChooser(intent, "Wyślij formularz Word e-mailem")); }
                      catch (ActivityNotFoundException ex) { Toast.makeText(this, "Brak aplikacji e-mail", Toast.LENGTH_LONG).show(); }
                  }
              }

              private void grantAttachmentUris(Intent intent, ArrayList<Uri> attachments) {
                  intent.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                  if (attachments == null || attachments.isEmpty()) return;
                  ClipData clipData = ClipData.newUri(getContentResolver(), "POLRING attachment", attachments.get(0));
                  for (int i = 1; i < attachments.size(); i++) {
                      clipData.addItem(new ClipData.Item(attachments.get(i)));
                  }
                  intent.setClipData(clipData);
              }

              private Uri createWordDocx() throws IOException {
                  String id = ringNumberValue.isEmpty() ? new SimpleDateFormat("yyyyMMdd_HHmmss", Locale.US).format(new Date()) : safeFileName(ringNumberValue);
                  File file = new File(getCacheDir(), "POLRING_zgloszenie_" + id + ".docx");
                  ZipOutputStream zip = new ZipOutputStream(new FileOutputStream(file));
                  try {
                      writeZip(zip, "[Content_Types].xml",
                              "<?xml version=\"1.0\" encoding=\"UTF-8\" standalone=\"yes\"?>" +
                              "<Types xmlns=\"http://schemas.openxmlformats.org/package/2006/content-types\">" +
                              "<Default Extension=\"rels\" ContentType=\"application/vnd.openxmlformats-package.relationships+xml\"/>" +
                              "<Default Extension=\"xml\" ContentType=\"application/xml\"/>" +
                              "<Override PartName=\"/word/document.xml\" ContentType=\"application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml\"/>" +
                              "</Types>");
                      writeZip(zip, "_rels/.rels",
                              "<?xml version=\"1.0\" encoding=\"UTF-8\" standalone=\"yes\"?>" +
                              "<Relationships xmlns=\"http://schemas.openxmlformats.org/package/2006/relationships\">" +
                              "<Relationship Id=\"rId1\" Type=\"http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument\" Target=\"word/document.xml\"/>" +
                              "</Relationships>");
                      writeZip(zip, "word/document.xml", buildDocxDocumentXml());
                  } finally {
                      zip.close();
                  }
                  return FileProvider.getUriForFile(this, getPackageName() + ".fileprovider", file);
              }

              private String buildDocxDocumentXml() {
                  StringBuilder d = new StringBuilder();
                  d.append("<?xml version=\"1.0\" encoding=\"UTF-8\" standalone=\"yes\"?>");
                  d.append("<w:document xmlns:w=\"http://schemas.openxmlformats.org/wordprocessingml/2006/main\">");
                  d.append("<w:body>");
                  d.append(docParagraph("Zgłoszenie ptaka z obrączką", true));
                  d.append(docParagraph("Formularz wygenerowany z aplikacji Zgłoś obrączkę Android. Plik jest edytowalny w Microsoft Word / Google Docs / LibreOffice.", false));
                  d.append(docParagraph("Dane obrączki / znacznika", true));
                  d.append("<w:tbl>");
                  d.append(docRow("Numer obrączki / kod", ringNumberValue));
                  d.append(docRow("Napis na obrączce", ringTextValue));
                  d.append(docRow("Typ znacznika", markerTypeValue));
                  d.append("</w:tbl>");
                  d.append(docParagraph("Dane ptaka", true));
                  d.append("<w:tbl>");
                  d.append(docRow("Gatunek", speciesValue));
                  d.append(docRow("Stan ptaka", birdStateValue));
                  d.append(docRow("Los ptaka", birdFateValue));
                  d.append("</w:tbl>");
                  d.append(docParagraph("Miejsce i czas", true));
                  d.append("<w:tbl>");
                  d.append(docRow("Miejsce", placeValue));
                  d.append(docRow("Współrzędne GPS", coordinatesValue));
                  d.append(docRow("Link do mapy", coordinatesValue.isEmpty() ? "" : "https://maps.google.com/?q=" + coordinatesValue.replace(" ", "")));
                  d.append(docRow("Data", dateValue));
                  d.append(docRow("Godzina", timeValue));
                  d.append("</w:tbl>");
                  d.append(docParagraph("Opis / uwagi", true));
                  d.append(docParagraph(descriptionValue.isEmpty() ? "—" : descriptionValue, false));
                  d.append(docParagraph("Dane zgłaszającego", true));
                  d.append("<w:tbl>");
                  d.append(docRow("Imię i nazwisko", reporterNameValue));
                  d.append(docRow("E-mail do odpowiedzi", reporterEmailValue));
                  d.append(docRow("Telefon", reporterPhoneValue));
                  d.append("</w:tbl>");
                  d.append(docParagraph("RODO / zgody", true));
                  d.append("<w:tbl>");
                  d.append(docRow("Zgoda na przetwarzanie danych osobowych w celach naukowych i monitoringu ptaków", rodoScientificValue ? "TAK" : "NIE"));
                  d.append(docRow("Akceptacja przekazania danych do POLRING / KCO", rodoPolringValue ? "TAK" : "NIE"));
                  d.append(docRow("Zgoda na kontakt w celu weryfikacji lub uzupełnienia zgłoszenia", rodoContactValue ? "TAK" : "NIE"));
                  d.append("</w:tbl>");
                  d.append(docParagraph("Załączniki zdjęciowe: " + photoUris.size() + " plików. Zdjęcia są dołączone osobno do wiadomości e-mail.", false));
                  d.append("<w:sectPr><w:pgSz w:w=\"11906\" w:h=\"16838\"/><w:pgMar w:top=\"1134\" w:right=\"1134\" w:bottom=\"1134\" w:left=\"1134\"/></w:sectPr>");
                  d.append("</w:body></w:document>");
                  return d.toString();
              }

              private String docParagraph(String text, boolean bold) {
                  return "<w:p><w:r>" + (bold ? "<w:rPr><w:b/></w:rPr>" : "") + "<w:t xml:space=\"preserve\">" + xml(text) + "</w:t></w:r></w:p>";
              }

              private String docRow(String label, String value) {
                  return "<w:tr>" +
                          "<w:tc><w:tcPr><w:tcW w:w=\"4200\" w:type=\"dxa\"/></w:tcPr><w:p><w:r><w:rPr><w:b/></w:rPr><w:t>" + xml(label) + "</w:t></w:r></w:p></w:tc>" +
                          "<w:tc><w:tcPr><w:tcW w:w=\"6200\" w:type=\"dxa\"/></w:tcPr><w:p><w:r><w:t xml:space=\"preserve\">" + xml(value == null || value.isEmpty() ? "—" : value) + "</w:t></w:r></w:p></w:tc>" +
                          "</w:tr>";
              }

              private void writeZip(ZipOutputStream zip, String name, String text) throws IOException {
                  zip.putNextEntry(new ZipEntry(name));
                  zip.write(text.getBytes(StandardCharsets.UTF_8));
                  zip.closeEntry();
              }

              private String xml(String s) {
                  if (s == null) return "";
                  return s.replace("&", "&amp;").replace("<", "&lt;").replace(">", "&gt;").replace("\"", "&quot;").replace("'", "&apos;").replace("\n", " ");
              }

              private String safeFileName(String s) {
                  if (s == null || s.trim().isEmpty()) return "bez_numeru";
                  return s.replaceAll("[^A-Za-z0-9_\\-]", "_");
              }

