name: Build Zgłoś obrączkę APK v11
run-name: Zgłoś obrączkę — budowa APK v11

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Utwórz projekt Android v11
        run: |
          set -euo pipefail
          rm -rf app build.gradle settings.gradle gradle.properties README.md
          mkdir -p app/src/main/java/pl/bartoszlawicki/polringreporter app/src/main/res/values app/src/main/res/xml app/src/main/res/drawable app/src/main/res/drawable-nodpi
          cat > settings.gradle <<'EOF_SETTINGS'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = 'Zgłoś obrączkę'
          include ':app'
          EOF_SETTINGS
          cat > build.gradle <<'EOF_ROOT_BUILD'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF_ROOT_BUILD
          cat > gradle.properties <<'EOF_GRADLE_PROPERTIES'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF_GRADLE_PROPERTIES
          cat > app/build.gradle <<'EOF_APP_BUILD'
          plugins {
              id 'com.android.application'
          }
          
          android {
              namespace 'pl.bartoszlawicki.polringreporter'
              compileSdk 35
          
              defaultConfig {
                  applicationId 'pl.bartoszlawicki.polringreporter'
                  minSdk 23
                  targetSdk 35
                  versionCode 11
                  versionName '0.11.0-vector-logo-no-png'
              }
          
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          
          dependencies {
              implementation 'androidx.core:core:1.13.1'
          }
          EOF_APP_BUILD
          cat > app/src/main/res/values/strings.xml <<'EOF_STRINGS'
          <resources>
              <string name="app_name">Zgłoś obrączkę</string>
          </resources>
          EOF_STRINGS
          cat > app/src/main/res/values/styles.xml <<'EOF_STYLES'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">true</item>
                  <item name="android:statusBarColor">#FAFCF7</item>
                  <item name="android:navigationBarColor">#FAFCF7</item>
                  <item name="android:colorAccent">#2E7D32</item>
              </style>
          </resources>
          EOF_STYLES
          cat > app/src/main/res/drawable/ic_app_icon.xml <<'EOF_APP_ICON'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#FAFCF7" android:pathData="M18,4h72c7.7,0 14,6.3 14,14v72c0,7.7 -6.3,14 -14,14H18C10.3,104 4,97.7 4,90V18C4,10.3 10.3,4 18,4z"/>
              <path android:fillColor="#DDF0D6" android:pathData="M11,73c15,-19 36,-25 58,-18c12,4 22,12 29,22v13H11z"/>
