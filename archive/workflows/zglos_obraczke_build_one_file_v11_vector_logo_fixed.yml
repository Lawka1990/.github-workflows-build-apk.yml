      - name: Ustaw Javę
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Ustaw Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Zbuduj APK debug
        run: gradle assembleDebug

      - name: Zapisz APK jako artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZglosObraczke-v11-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Skopiuj APK do repozytorium
        run: |
          mkdir -p apk
          cp app/build/outputs/apk/debug/*.apk apk/ZglosObraczke-v11-debug.apk
          ls -lh apk

      - name: Wgraj APK do zakładki Code
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apk/ZglosObraczke-v11-debug.apk README.md .github/workflows/build-apk.yml || true
          git commit -m "Zbuduj APK v11" || echo "Brak zmian do commita"
          git push
