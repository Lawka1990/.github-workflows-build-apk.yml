          </vector>
          EOF_APP_ICON
          cat > app/src/main/res/xml/file_paths.xml <<'EOF_FILE_PATHS'
          <?xml version="1.0" encoding="utf-8"?>
          <paths xmlns:android="http://schemas.android.com/apk/res/android">
              <external-files-path name="images" path="Pictures" />
              <cache-path name="cache" path="." />
          </paths>
          EOF_FILE_PATHS
          cat > app/src/main/AndroidManifest.xml <<'EOF_MANIFEST'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
          
              <uses-feature android:name="android.hardware.camera" android:required="false" />
          
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
          
              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:icon="@drawable/ic_app_icon"
                  android:roundIcon="@drawable/ic_app_icon"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="false">
          
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
          
                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="${applicationId}.fileprovider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/file_paths" />
                  </provider>
          
              </application>
          </manifest>
          EOF_MANIFEST
          cat > app/src/main/java/pl/bartoszlawicki/polringreporter/MainActivity.java <<'EOF_MAIN_JAVA'

          package pl.bartoszlawicki.polringreporter;

          import android.Manifest;
          import android.app.Activity;
          import android.app.DatePickerDialog;
          import android.app.TimePickerDialog;
          import android.content.ActivityNotFoundException;
          import android.content.ClipData;
          import android.content.ClipboardManager;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.location.Location;
          import android.location.LocationManager;
          import android.location.LocationListener;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.os.Environment;
          import android.provider.MediaStore;
          import android.text.InputType;
          import android.util.Patterns;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.view.Window;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.ArrayAdapter;
          import android.widget.AutoCompleteTextView;
          import android.widget.Button;
          import android.widget.CheckBox;
          import android.widget.EditText;
          import android.widget.ImageView;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.Spinner;
          import android.widget.TextView;
          import android.widget.Toast;

          import androidx.core.content.FileProvider;

          import org.json.JSONArray;
          import org.json.JSONObject;

          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.IOException;
          import java.nio.charset.StandardCharsets;
          import java.text.SimpleDateFormat;
          import java.util.ArrayList;
          import java.util.Calendar;
          import java.util.Date;
          import java.util.Locale;
          import java.util.List;
          import java.util.regex.Matcher;
          import java.util.regex.Pattern;
          import java.util.zip.ZipEntry;
          import java.util.zip.ZipOutputStream;

          public class MainActivity extends Activity {
              private static final int REQ_CAMERA = 10;
              private static final int REQ_GALLERY = 11;
              private static final int REQ_LOCATION = 12;
              private static final String PREFS = "zglos_obraczke_prefs_v11";
              private static final String PREF_DRAFT = "draft";
              private static final String POLRING_EMAIL = "ring@miiz.waw.pl";
              private static final String POLRING_FORM = "https://ring.stornit.gda.pl/Stw.aspx";

              private final int GREEN = Color.rgb(46, 125, 50);
              private final int GREEN_DARK = Color.rgb(27, 94, 32);
              private final int GREEN_LIGHT = Color.rgb(232, 245, 233);
              private final int BLUE = Color.rgb(21, 101, 192);
              private final int BLUE_LIGHT = Color.rgb(232, 240, 254);
              private final int BG = Color.rgb(250, 252, 247);
              private final int TEXT = Color.rgb(25, 32, 37);
              private final int MUTED = Color.rgb(91, 103, 112);
              private final int BORDER = Color.rgb(218, 226, 214);

              private final String[] MARKER_TYPES = {
                      "Obrączka metalowa", "Obrączka kolorowa", "Obrączka metalowa + kolorowa", "Obroża szyjna", "Znacznik skrzydłowy", "Nadajnik / logger", "Inny znacznik"
              };
              private final String[] BIRD_STATES = {
                      "Żywy – zdrowy", "Żywy – ranny", "Żywy – osłabiony", "Martwy świeży", "Martwy w rozkładzie", "Nie wiem / nie dotyczy"
              };
              private final String[] BIRD_FATES = {
                      "Zaobserwowany", "Wypuszczony", "Nie dotykano", "Przekazany do azylu", "Przekazany weterynarzowi", "Znaleziono martwego", "Znaleziono samą obrączkę", "Inne"
              };
              private final String[] SPECIES_HINTS = {
                      "Zięba (Fringilla coelebs)", "Bocian biały (Ciconia ciconia)", "Bocian czarny (Ciconia nigra)", "Łabędź niemy (Cygnus olor)", "Łabędź krzykliwy (Cygnus cygnus)",
                      "Gęś gęgawa (Anser anser)", "Gęś białoczelna (Anser albifrons)", "Kaczka krzyżówka (Anas platyrhynchos)", "Kormoran zwyczajny (Phalacrocorax carbo)",
                      "Czapla siwa (Ardea cinerea)", "Żuraw (Grus grus)", "Mewa śmieszka (Chroicocephalus ridibundus)", "Mewa srebrzysta (Larus argentatus)",
                      "Mewa siwa (Larus canus)", "Rybitwa rzeczna (Sterna hirundo)", "Gołąb miejski (Columba livia f. urbana)", "Gołąb grzywacz (Columba palumbus)",
                      "Gawron (Corvus frugilegus)", "Kawka (Corvus monedula)", "Wrona siwa (Corvus cornix)", "Kruk (Corvus corax)",
                      "Sikora bogatka (Parus major)", "Sikora modra (Cyanistes caeruleus)", "Kos (Turdus merula)", "Szpak (Sturnus vulgaris)",
                      "Rudzik (Erithacus rubecula)", "Wróbel domowy (Passer domesticus)", "Mazurek (Passer montanus)",
                      "Pustułka (Falco tinnunculus)", "Myszołów (Buteo buteo)", "Jastrząb (Accipiter gentilis)", "Sowa uszata (Asio otus)", "Nieznany gatunek"
              };

              private int step = 0;
              private Uri currentPhotoUri;
              private final ArrayList<Uri> photoUris = new ArrayList<>();

              private EditText ringNumber;
              private EditText ringText;
              private Spinner markerTypeSpinner;
              private AutoCompleteTextView species;
              private Spinner birdStateSpinner;
              private Spinner birdFateSpinner;
              private EditText place;
              private EditText coordinates;
              private EditText date;
              private EditText time;
              private EditText description;
              private EditText reporterName;
              private EditText reporterEmail;
              private EditText reporterPhone;
              private CheckBox rodoScientific;
              private CheckBox rodoPolring;
              private CheckBox rodoContact;
              private WebView mapWebView;
              private TextView coordLabelView;

              private String ringNumberValue = "";
              private String ringTextValue = "";
              private String markerTypeValue = "Obrączka metalowa";
              private String speciesValue = "";
              private String birdStateValue = "Żywy – zdrowy";
              private String birdFateValue = "Zaobserwowany";
              private String placeValue = "";
              private String coordinatesValue = "";
              private String dateValue = "";
              private String timeValue = "";
              private String descriptionValue = "";
              private String reporterNameValue = "";
              private String reporterEmailValue = "";
              private String reporterPhoneValue = "";
              private boolean rodoScientificValue = false;
              private boolean rodoPolringValue = false;
              private boolean rodoContactValue = false;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  Window window = getWindow();
                  window.setStatusBarColor(BG);
                  window.setNavigationBarColor(BG);
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                      window.getDecorView().setSystemUiVisibility(View.SYSTEM_UI_FLAG_LIGHT_STATUS_BAR);
                  }
                  setDefaultDateTimeValues();
                  loadDraftToModel();
                  render();
              }

              private void render() {
                  ScrollView scroll = new ScrollView(this);
                  scroll.setFillViewport(true);
                  scroll.setBackgroundColor(BG);

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(dp(14), dp(16), dp(14), dp(18));
                  scroll.addView(root, new ScrollView.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT
                  ));

                  addHeader(root);
                  addStepper(root);

                  if (step == 0) addDataScreen(root);
                  if (step == 1) addLocationScreen(root);
                  if (step == 2) addSummaryScreen(root);
                  if (step == 3) addPolringWebScreen(root);

                  setContentView(scroll);
              }

              private void addHeader(LinearLayout root) {
                  LinearLayout header = new LinearLayout(this);
                  header.setOrientation(LinearLayout.HORIZONTAL);
                  header.setGravity(Gravity.CENTER_VERTICAL);
                  header.setPadding(dp(6), dp(4), dp(6), dp(14));
                  root.addView(header, matchWrap());

                  ImageView logo = new ImageView(this);
                  logo.setImageResource(R.drawable.ic_app_icon);
                  logo.setBackground(round(Color.WHITE, Color.rgb(210, 226, 220), dp(20), dp(1)));
                  logo.setPadding(dp(0), dp(0), dp(0), dp(0));
                  logo.setScaleType(ImageView.ScaleType.CENTER_INSIDE);
                  header.addView(logo, new LinearLayout.LayoutParams(dp(66), dp(66)));

                  LinearLayout titleBox = new LinearLayout(this);
                  titleBox.setOrientation(LinearLayout.VERTICAL);
                  titleBox.setPadding(dp(12), 0, 0, 0);
                  header.addView(titleBox, new LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1));

                  TextView title = new TextView(this);
                  title.setText("Zgłoś obrączkę");
                  title.setTextSize(24);
                  title.setTextColor(GREEN_DARK);
                  title.setTypeface(Typeface.DEFAULT_BOLD);
                  titleBox.addView(title);

                  TextView subtitle = new TextView(this);
                  subtitle.setText("Zgłoszenie ptaka z obrączką");
                  subtitle.setTextSize(15);
                  subtitle.setTextColor(MUTED);
                  subtitle.setPadding(0, dp(2), 0, 0);
                  titleBox.addView(subtitle);
              }

              private void addStepper(LinearLayout root) {
                  LinearLayout wrap = new LinearLayout(this);
                  wrap.setOrientation(LinearLayout.VERTICAL);
                  wrap.setPadding(0, 0, 0, dp(12));
                  root.addView(wrap, matchWrap());

                  LinearLayout row = new LinearLayout(this);
                  row.setOrientation(LinearLayout.HORIZONTAL);
                  row.setGravity(Gravity.CENTER);
                  wrap.addView(row, matchWrap());

                  String[] labels = {"Dane", "Lokalizacja", "Zdjęcia", "Wysyłka"};
                  for (int i = 0; i < labels.length; i++) {
                      LinearLayout item = new LinearLayout(this);
                      item.setOrientation(LinearLayout.VERTICAL);
                      item.setGravity(Gravity.CENTER);
                      row.addView(item, new LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1));

                      TextView dot = new TextView(this);
                      boolean done = (step == 1 && i == 0) || (step >= 2 && i < 3) || (step == 3 && i < 4);
                      boolean active = (step == 0 && i == 0) || (step == 1 && (i == 1 || i == 2)) || ((step == 2 || step == 3) && i == 3);
                      dot.setText(done ? "✓" : String.valueOf(i + 1));
                      dot.setTextSize(14);
                      dot.setTypeface(Typeface.DEFAULT_BOLD);
                      dot.setTextColor(Color.WHITE);
                      dot.setGravity(Gravity.CENTER);
                      dot.setBackground(round(done ? GREEN : active ? BLUE : Color.rgb(170, 174, 166), 999));
                      item.addView(dot, new LinearLayout.LayoutParams(dp(30), dp(30)));

                      TextView label = new TextView(this);
                      label.setText(labels[i]);
                      label.setTextSize(12);
                      label.setTextColor(active || done ? TEXT : MUTED);
                      label.setGravity(Gravity.CENTER);
                      label.setPadding(0, dp(5), 0, 0);
                      item.addView(label);
                  }
              }

              private void addDataScreen(LinearLayout root) {
                  LinearLayout card = card(root, "Dane obrączki i ptaka", "Pola z wyborem są teraz listami. Gatunek ptaka ma podpowiedzi po wpisaniu pierwszych liter.");
                  ringNumber = addFieldRow(card, "🔗", "Numer obrączki", "Wpisz pełny numer lub kod", ringNumberValue, false, false);
                  ringText = addFieldRow(card, "ABC", "Napis na obrączce", "Dokładny tekst widoczny na obrączce", ringTextValue, false, false);
                  markerTypeSpinner = addSpinnerRow(card, "🏷", "Typ znacznika", MARKER_TYPES, markerTypeValue);
                  species = addSpeciesRow(card, "🐦", "Gatunek ptaka", "Zacznij pisać, np. bocian, mewa, łabędź", speciesValue);
                  birdStateSpinner = addSpinnerRow(card, "❤", "Stan ptaka", BIRD_STATES, birdStateValue);
                  birdFateSpinner = addSpinnerRow(card, "🍃", "Los ptaka", BIRD_FATES, birdFateValue);

                  LinearLayout nav = navRow(root);
                  Button save = outlineButton("Zapisz szkic");
                  save.setOnClickListener(v -> { updateModelFromFields(); saveDraft(); });
                  nav.addView(save, new LinearLayout.LayoutParams(0, dp(52), 1));
                  SpaceSmall(nav);
                  Button next = filledButton("Dalej  →");
                  next.setOnClickListener(v -> { updateModelFromFields(); step = 1; render(); });
                  nav.addView(next, new LinearLayout.LayoutParams(0, dp(52), 1));
              }

              private void addLocationScreen(LinearLayout root) {
                  LinearLayout locCard = card(root, "Lokalizacja", "Mapa poniżej pokazuje aktualny punkt z pola współrzędnych. Po zmianie GPS kliknij „Odśwież mapę”.");

                  coordLabelView = new TextView(this);
                  updateCoordLabel();
                  coordLabelView.setTextSize(14);
                  coordLabelView.setPadding(dp(4), 0, dp(4), dp(8));
                  locCard.addView(coordLabelView);

                  mapWebView = new WebView(this);
                  WebSettings settings = mapWebView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setLoadWithOverviewMode(true);
                  settings.setUseWideViewPort(true);
                  mapWebView.setBackgroundColor(Color.TRANSPARENT);
                  mapWebView.setWebViewClient(new WebViewClient());
                  mapWebView.loadUrl(osmEmbedUrl());
                  locCard.addView(mapWebView, new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, dp(240)));

                  LinearLayout buttons = new LinearLayout(this);
                  buttons.setOrientation(LinearLayout.HORIZONTAL);
                  buttons.setPadding(0, dp(12), 0, dp(6));
                  locCard.addView(buttons, matchWrap());

                  Button gps = outlineButton("◎ Pobierz GPS");
                  gps.setOnClickListener(v -> useGps());
                  buttons.addView(gps, new LinearLayout.LayoutParams(0, dp(52), 1));
                  SpaceSmall(buttons);
                  Button refresh = blueOutlineButton("↻ Odśwież mapę");
                  refresh.setOnClickListener(v -> refreshMapFromFields());
                  buttons.addView(refresh, new LinearLayout.LayoutParams(0, dp(52), 1));

                  Button mapBtn = blueOutlineButton("▣ Otwórz punkt w mapach");
                  mapBtn.setOnClickListener(v -> openMap());
                  locCard.addView(mapBtn, new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, dp(52)));

                  place = addFieldRow(locCard, "📍", "Miejsce", "Miejscowość, adres lub opis miejsca", placeValue, true, false);
                  coordinates = addFieldRow(locCard, "◎", "Współrzędne GPS", "Np. 54.352000, 18.646600", coordinatesValue, false, false);
                  date = addFieldRow(locCard, "📅", "Data", "Kliknij, aby wybrać datę z kalendarza", dateValue, false, false);
                  configureDateField(date);
                  time = addFieldRow(locCard, "🕘", "Godzina", "Kliknij, aby wybrać godzinę", timeValue, false, false);
                  configureTimeField(time);

                  LinearLayout photoCard = card(root, "Zdjęcia", "Dodaj zdjęcie obrączki i/lub ptaka. Zdjęcia zostaną dołączone do maila Gmail.");
                  LinearLayout photoTiles = new LinearLayout(this);
                  photoTiles.setOrientation(LinearLayout.HORIZONTAL);
                  photoCard.addView(photoTiles, matchWrap());
                  photoTiles.addView(photoTile("Obrączka", photoUris.size() > 0 ? "✓ dodano" : "brak"), new LinearLayout.LayoutParams(0, dp(118), 1));
                  SpaceSmall(photoTiles);
                  photoTiles.addView(photoTile("Ptak", photoUris.size() > 1 ? "✓ dodano" : "opcjonalnie"), new LinearLayout.LayoutParams(0, dp(118), 1));

                  LinearLayout photoButtons = new LinearLayout(this);
                  photoButtons.setOrientation(LinearLayout.HORIZONTAL);
                  photoButtons.setPadding(0, dp(12), 0, 0);
                  photoCard.addView(photoButtons, matchWrap());
                  Button camera = outlineButton("📷 Zrób zdjęcie");
                  camera.setOnClickListener(v -> takePhoto());
